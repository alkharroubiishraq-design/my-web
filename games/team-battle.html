<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معركة الفرق — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .jb-grid{ display:grid; gap:10px; width:100%; max-width:900px; margin:0 auto; }
  .jb-cat{ background: var(--grad-1); text-align:center; padding:12px 6px; border-radius:12px; font-weight:800; font-size:.95rem; }
  .jb-cell{ background: var(--surface-2); border-radius:12px; text-align:center; padding:18px 6px; font-weight:900; font-size:1.3rem; cursor:pointer; border:2px solid transparent; transition:.15s; color: var(--accent-2); }
  .jb-cell:hover{ border-color: var(--accent-2); transform: translateY(-2px); }
  .jb-cell.used{ background: transparent; color: var(--surface-2); cursor:default; box-shadow:none; }
  .jb-cell.empty{ visibility:hidden; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🏆 معركة الفرق</h1>
    <p>اختر فئة وقيمة نقطية، ثم امنح النقاط للفريق الذي يُجيب بشكل صحيح.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, board;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🏆</div><h3>هيّئ اللعبة</h3><p>هذه اللعبة تدعم لاعبَين أو فريقَين فأكثر يتنافسون على النقاط.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد معركة الفرق', allowIndividual:true, allowTeams:true, needQuestions:true, minPlayers:2, maxPlayers:6 }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const byCat = {};
  bank.questions.forEach(q=>{
    const c = q.category || 'عام';
    (byCat[c] = byCat[c] || []).push(q);
  });
  const cats = Object.keys(byCat).slice(0, 6);
  if(!cats.length){ EGL.toast('لا توجد أسئلة في هذا البنك'); return; }
  board = cats.map(c => ({
    name: c,
    cells: EGL.shuffle(byCat[c]).sort((a,b)=>(a.points||0)-(b.points||0)).slice(0,4).map(q=>({q, used:false}))
  }));
  const maxRows = Math.max(...board.map(c=>c.cells.length));

  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div>
    <div class="jb-grid" id="jb-grid" style="grid-template-columns: repeat(${cats.length}, 1fr);"></div>
    <div id="q-area" style="margin-top:22px; width:100%;"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), cfg.players);

  const grid = document.getElementById('jb-grid');
  let html = board.map(c => `<div class="jb-cat">${EGL.escapeHtml(c.name)}</div>`).join('');
  for(let r=0;r<maxRows;r++){
    board.forEach((c, ci) => {
      const cell = c.cells[r];
      if(!cell){ html += `<div class="jb-cell empty"></div>`; }
      else html += `<div class="jb-cell" data-ci="${ci}" data-ri="${r}">${cell.q.points||10}</div>`;
    });
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.jb-cell[data-ci]').forEach(cell=>{
    cell.addEventListener('click', ()=>openCell(cell));
  });
}

function openCell(cellEl){
  const ci = parseInt(cellEl.dataset.ci), ri = parseInt(cellEl.dataset.ri);
  const entry = board[ci].cells[ri];
  if(entry.used) return;
  entry.used = true;
  cellEl.classList.add('used');
  cellEl.textContent = '';
  const q = entry.q;
  const area = document.getElementById('q-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">${EGL.escapeHtml(board[ci].name)}</span><span class="badge">${q.points} نقطة</span></div>
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
      ${q.type!=='open' ? `<p style="font-weight:700; color:var(--accent);">✔ الإجابة الصحيحة: ${EGL.escapeHtml(q.answerText)}</p>` : ''}
      <p>من أجاب بشكل صحيح؟</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        ${sb.players.map((p,i)=>`<button class="btn btn-accent btn-sm" data-i="${i}">${p.emoji} ${EGL.escapeHtml(p.name)}</button>`).join('')}
        <button class="btn btn-outline btn-sm" id="btn-nobody">لا أحد أجاب</button>
      </div>
    </div>`;
  area.querySelectorAll('button[data-i]').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = parseInt(btn.dataset.i);
    sb.addScore(i, q.points);
    EGL.beep('correct'); EGL.confetti(30);
    area.innerHTML = '';
    checkEnd();
  }));
  area.querySelector('#btn-nobody').addEventListener('click', ()=>{ EGL.beep('wrong'); area.innerHTML=''; checkEnd(); });
}

function checkEnd(){
  const remaining = board.some(c => c.cells.some(cell => !cell.used));
  if(remaining) return;
  EGL.confetti(90); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت المعركة!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
