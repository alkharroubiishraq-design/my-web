<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إكس أو المعرفة — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❌</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .ttt-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; width: min(300px, 88vw); margin: 16px auto; aspect-ratio:1/1; }
  .ttt-cell{ background: var(--surface-2); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2.4rem; cursor:pointer; border:2px solid rgba(255,255,255,.08); transition:.15s; }
  .ttt-cell:hover{ border-color: var(--primary); }
  .ttt-cell.taken{ cursor:default; }
  .ttt-cell.win-cell{ background: rgba(43,224,138,.35); border-color: var(--success); }
  .turn-banner{ text-align:center; font-weight:900; font-size:1.05rem; margin-bottom:6px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>❌⭕ إكس أو المعرفة</h1>
    <p>فريقان يتناوبان اختيار خلية — أجيبوا صح لتحصلوا عليها، وأخطئوا فيمرّ الدور بلا مقابل. أول من يكوّن خطًا من ثلاثة يفوز!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const SYMS = ['❌','⭕'];
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let teams, questions, qIdx, board, turnIdx, pendingIdx, gameOver=false;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">❌</div><h3>هيّئ اللعبة</h3><p>لعبة إكس أو الكلاسيكية لفريقين فقط — كل خلية تحتاج إجابة صحيحة لتُحسم.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد إكس أو المعرفة', allowIndividual:false, allowTeams:true, needQuestions:true, qType:['mcq','tf'], minPlayers:2, maxPlayers:2 }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  questions = EGL.shuffle(bank.questions.filter(q=>q.type==='mcq'||q.type==='tf'));
  if(questions.length < 5){ EGL.toast('تحتاج هذه اللعبة ٥ أسئلة اختيار/صح-خطأ على الأقل'); return; }
  if(cfg.players.length !== 2){ EGL.toast('إكس أو المعرفة تحتاج فريقين بالضبط'); return; }
  teams = cfg.players;
  qIdx = 0;
  board = new Array(9).fill(null);
  turnIdx = 0;
  gameOver = false;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="turn-banner" id="turn-banner"></div><div class="ttt-grid" id="grid"></div><div id="q-area"></div>`;
  renderGrid();
  updateBanner();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = board.map((v,i)=>`<div class="ttt-cell ${v?'taken':''}" data-i="${i}">${v ? SYMS[v.teamIdx] : ''}</div>`).join('');
  grid.querySelectorAll('.ttt-cell').forEach(cell=>{
    const i = parseInt(cell.dataset.i);
    if(!board[i]) cell.addEventListener('click', ()=>pickCell(i));
  });
}

function updateBanner(){
  document.getElementById('turn-banner').innerHTML = `🎯 دور: <span style="color:var(--accent-2)">${SYMS[turnIdx]} ${teams[turnIdx].emoji} ${EGL.escapeHtml(teams[turnIdx].name)}</span>`;
}

function pickCell(i){
  if(gameOver || board[i]) return;
  pendingIdx = i;
  if(qIdx >= questions.length){ questions = EGL.shuffle(questions); qIdx = 0; }
  const q = questions[qIdx++];
  window._tttQ = q;
  document.querySelectorAll('.ttt-cell').forEach(c=>c.style.pointerEvents='none');
  const area = document.getElementById('q-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">خلية رقم ${i+1}</span><span class="badge">${EGL.diffLabel(q.difficulty)}</span></div>
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
      <div class="options" id="opts">${q.options.map((o,oi)=>`<button class="option-btn" data-oi="${oi}">${EGL.escapeHtml(o)}</button>`).join('')}</div>
    </div>`;
  area.querySelectorAll('.option-btn').forEach(btn=>btn.addEventListener('click', ()=>answerCell(parseInt(btn.dataset.oi))));
}

function answerCell(oi){
  const q = window._tttQ;
  const opts = document.querySelectorAll('.option-btn');
  opts.forEach(b=>b.disabled=true);
  opts[oi].classList.add(oi===q.correctIndex?'correct':'wrong');
  opts[q.correctIndex].classList.add('correct');
  const correct = oi === q.correctIndex;
  if(correct){
    board[pendingIdx] = { teamIdx: turnIdx };
    EGL.beep('correct');
  } else {
    EGL.beep('wrong');
    EGL.toast('❌ إجابة خاطئة — الدور ينتقل بلا خلية');
  }
  setTimeout(()=>{
    document.getElementById('q-area').innerHTML = '';
    renderGrid();
    const win = checkWin();
    if(win){ return endGame(win.teamIdx, win.line); }
    if(board.every(c=>c)) return endGame(null);
    turnIdx = 1 - turnIdx;
    updateBanner();
    document.querySelectorAll('.ttt-cell').forEach(c=>c.style.pointerEvents='auto');
  }, 1600);
}

function checkWin(){
  for(const line of LINES){
    const [a,b,c] = line;
    if(board[a] && board[b] && board[c] && board[a].teamIdx===board[b].teamIdx && board[b].teamIdx===board[c].teamIdx){
      return { teamIdx: board[a].teamIdx, line };
    }
  }
  return null;
}

function endGame(teamIdx, line){
  gameOver = true;
  document.querySelectorAll('.ttt-cell').forEach(c=>c.style.pointerEvents='none');
  if(line){
    line.forEach(i=> document.querySelector(`.ttt-cell[data-i="${i}"]`).classList.add('win-cell'));
  }
  EGL.confetti(150); EGL.beep('win');
  const stage = document.getElementById('stage');
  const banner = document.createElement('div');
  banner.className = 'qcard';
  banner.style.marginTop = '18px';
  banner.innerHTML = teamIdx !== null
    ? `<div style="font-size:3rem;">🏆</div><h2>${SYMS[teamIdx]} ${teams[teamIdx].emoji} ${EGL.escapeHtml(teams[teamIdx].name)} يفوز!</h2>
       <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
         <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
         <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
       </div>`
    : `<div style="font-size:3rem;">🤝</div><h2>تعادل! امتلأت الشبكة بلا فائز</h2>
       <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
         <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
         <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
       </div>`;
  stage.appendChild(banner);
}

init();
</script>
</body>
</html>
