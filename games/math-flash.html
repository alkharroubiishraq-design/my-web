<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميزان الأرقام — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .zones{ display:grid; gap:14px; width:100%; max-width:900px; margin: 10px auto; }
  .zones.z2{ grid-template-columns: 1fr 1fr; }
  .zones.z3{ grid-template-columns: repeat(3, 1fr); }
  .zones.z4{ grid-template-columns: 1fr 1fr; }
  .zone{ border-radius: var(--radius); padding: 20px 12px; text-align:center; box-shadow: var(--shadow); border:2px solid rgba(255,255,255,.08); min-height:220px; display:flex; flex-direction:column; justify-content:space-between; }
  .zone .zname{ font-weight:900; font-size:1.05rem; }
  .zone .zscore{ font-size:1.4rem; font-weight:900; color: var(--accent-2); }
  .zone .tf-btns{ display:flex; gap:10px; }
  .zone .tf-btns button{ flex:1; padding:18px 8px; border-radius:14px; border:none; font-weight:900; font-size:1.1rem; cursor:pointer; color:#fff; }
  .zone .tf-true{ background: var(--success); }
  .zone .tf-false{ background: var(--danger); }
  .zone .tf-btns button:disabled{ opacity:.35; }
  .zone.answered-correct{ border-color: var(--success); box-shadow: 0 0 0 3px rgba(43,224,138,.25); }
  .zone.answered-wrong{ border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,92,92,.25); }
  .zone .result-tag{ font-weight:800; font-size:.85rem; min-height:20px; }
  .flash-text{ font-size:1.6rem; font-weight:900; text-align:center; margin: 14px 0 20px; }
  .countdown-overlay{ position:fixed; inset:0; background: rgba(5,6,20,.88); display:flex; align-items:center; justify-content:center; z-index:250; }
  .countdown-num{ font-size: 9rem; font-weight:900; color: var(--accent-2); text-shadow: 0 0 40px rgba(255,210,63,.6); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>⚖️ ميزان الأرقام</h1>
    <p>معادلة واحدة على الشاشة، وكل فريق يضغط "صح" أو "خطأ" في منطقته الخاصة بنفس اللحظة — الأسرع والأصح يكسب أكثر!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const ROUNDS = 10, ANSWER_TIME = 6;
let players, scores, difficulty, round, roundStart, zoneAnswered, timerInt, timeLeft;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">⚖️</div><h3>هيّئ اللعبة</h3><p>مثالية لشاشة تفاعلية أو جهاز واحد يلمسه أكثر من فريق بنفس الوقت (2-4 فرق).</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({
    title:'إعداد ميزان الأرقام', allowIndividual:false, allowTeams:true, skipBank:true, minPlayers:2, maxPlayers:4,
    extraFieldsHtml: `<label>مستوى الصعوبة</label><div class="chip-group" id="mf-diff-chips" style="margin-bottom:16px;">
      <div class="chip selected" data-v="easy">سهل</div>
      <div class="chip" data-v="medium">متوسط</div>
      <div class="chip" data-v="hard">صعب</div>
    </div>
    <input type="hidden" id="mf-diff-value" data-extra="difficulty" value="easy">`
  }, startGame);
  const group = document.getElementById('mf-diff-chips');
  const hidden = document.getElementById('mf-diff-value');
  if(group){
    group.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
      group.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
      hidden.value = c.dataset.v;
    }));
  }
}

function startGame(cfg){
  players = cfg.players;
  difficulty = cfg.extra.difficulty || 'easy';
  scores = players.map(()=>0);
  round = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:10px;"></div><div id="game-area"></div>`;
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS){ showResults(); return; }
  document.getElementById('round-badge').textContent = `⚖️ الجولة ${round} / ${ROUNDS}`;
  renderRound();
}

function renderRound(){
  clearInterval(timerInt);
  zoneAnswered = players.map(()=>null);
  const stmt = EGL.genMathStatement(difficulty);
  window._curStmt = stmt;
  const zClass = players.length === 3 ? 'z3' : (players.length === 4 ? 'z4' : 'z2');
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="flash-text" id="flash-text" style="visibility:hidden;">${stmt.text}</div>
    <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div class="zones ${zClass}" id="zones"></div>
    <div style="text-align:center; margin-top:14px;"><button class="btn btn-gold" id="btn-flash">⚡ اعرض المعادلة!</button></div>
  `;
  const zonesEl = document.getElementById('zones');
  const colors = ['#7c5cff','#ff5c9e','#21e6c1','#f0a93f'];
  zonesEl.innerHTML = players.map((p,i)=>`
    <div class="zone" id="zone-${i}" style="background:linear-gradient(160deg, ${colors[i%colors.length]}55, var(--surface))">
      <div><div class="zname">${p.emoji} ${EGL.escapeHtml(p.name)}</div><div class="zscore">${scores[i]}</div></div>
      <div class="result-tag" id="result-${i}"></div>
      <div class="tf-btns">
        <button class="tf-true" data-i="${i}" data-v="true" disabled>✅ صح</button>
        <button class="tf-false" data-i="${i}" data-v="false" disabled>❌ خطأ</button>
      </div>
    </div>
  `).join('');
  zonesEl.querySelectorAll('.tf-btns button').forEach(btn=>{
    btn.addEventListener('click', ()=> zoneAnswer(parseInt(btn.dataset.i), btn.dataset.v === 'true'));
  });
  document.getElementById('btn-flash').addEventListener('click', startFlash);
}

function startFlash(){
  document.getElementById('btn-flash').disabled = true;
  let n = 3;
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  overlay.innerHTML = `<div class="countdown-num" id="cd-num">${n}</div>`;
  document.body.appendChild(overlay);
  EGL.beep('tick');
  const iv = setInterval(()=>{
    n--;
    if(n>0){ overlay.querySelector('#cd-num').textContent = n; EGL.beep('tick'); }
    else {
      overlay.querySelector('#cd-num').textContent = 'شوفوا! 👀';
      overlay.querySelector('#cd-num').style.fontSize = '5rem';
      EGL.beep('win');
      clearInterval(iv);
      setTimeout(()=>{ overlay.remove(); openAnswering(); }, 500);
    }
  }, 650);
}

function openAnswering(){
  document.getElementById('flash-text').style.visibility = 'visible';
  document.querySelectorAll('.tf-btns button').forEach(b=>b.disabled=false);
  roundStart = performance.now();
  timeLeft = ANSWER_TIME;
  updateTimerBar();
  timerInt = setInterval(()=>{
    timeLeft--; updateTimerBar();
    if(timeLeft<=0) resolveRound();
  }, 1000);
}

function updateTimerBar(){
  const fill = document.getElementById('timer-fill');
  if(fill) fill.style.width = (timeLeft/ANSWER_TIME*100)+'%';
}

function zoneAnswer(i, val){
  if(zoneAnswered[i] !== null) return;
  const t = performance.now() - roundStart;
  zoneAnswered[i] = { val, t };
  const zone = document.getElementById('zone-'+i);
  zone.querySelectorAll('.tf-btns button').forEach(b=>b.disabled=true);
  document.getElementById('result-'+i).textContent = `⏱ ${(t/1000).toFixed(2)} ث`;
  EGL.beep('tick');
  if(zoneAnswered.every(z => z !== null)) resolveRound();
}

function resolveRound(){
  clearInterval(timerInt);
  const stmt = window._curStmt;
  players.forEach((p,i)=>{
    const zone = document.getElementById('zone-'+i);
    zone.querySelectorAll('.tf-btns button').forEach(b=>b.disabled=true);
    const ans = zoneAnswered[i];
    const resultTag = document.getElementById('result-'+i);
    if(!ans){ resultTag.textContent = '⏱ لم يُجب'; zone.classList.add('answered-wrong'); return; }
    if(ans.val === stmt.isTrue){
      const bonus = Math.round(Math.max(0, (ANSWER_TIME*1000 - ans.t)/(ANSWER_TIME*1000)) * 10);
      scores[i] += 10 + bonus;
      zone.classList.add('answered-correct');
      resultTag.textContent = `✅ صحيح (+${10+bonus})`;
    } else {
      zone.classList.add('answered-wrong');
      resultTag.textContent = `❌ خطأ`;
    }
    zone.querySelector('.zscore').textContent = scores[i];
  });
  EGL.beep(zoneAnswered.some(a=>a && a.val===stmt.isTrue) ? 'correct' : 'wrong');
  EGL.confetti(30);
  setTimeout(nextRound, 2200);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = players.map((p,i)=>({...p, score:scores[i]})).sort((a,b)=>b.score-a.score);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
