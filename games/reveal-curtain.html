<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشف الستار — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .curtain-box{ position:relative; width:280px; height:280px; margin: 14px auto; border-radius: var(--radius); overflow:hidden; box-shadow: var(--shadow); background: var(--bg-soft); }
  .curtain-big-emoji{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:180px; }
  .curtain-grid{ position:absolute; inset:0; display:grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(4,1fr); }
  .curtain-tile{ background: var(--surface-2); border:1px solid var(--bg-soft); display:flex; align-items:center; justify-content:center; font-size:1.2rem; color: var(--text-dim); transition: opacity .4s; }
  .curtain-tile.hidden{ opacity:0; pointer-events:none; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🖼️ كشف الستار</h1>
    <p>كل إجابة صحيحة تكشف جزءًا من الصورة المخفية — أول من يخمّنها يفوز بمكافأة كبرى!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const PICTURES = [
  { e:'🦁', label:'أسد' }, { e:'🌋', label:'بركان' }, { e:'🏰', label:'قلعة' },
  { e:'🚀', label:'صاروخ' }, { e:'🐋', label:'حوت' }, { e:'🎸', label:'غيتار' },
  { e:'🦋', label:'فراشة' }, { e:'⚓', label:'مرساة' }, { e:'🎡', label:'عجلة فرح' },
  { e:'🪐', label:'كوكب' }, { e:'🏔️', label:'جبل' }, { e:'🌵', label:'صبار' },
];
let sb, players, activeI, pool, poolIdx, questions, qIdx, pictureRound, PICTURE_ROUNDS, tilesLeft, curPicture;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🖼️</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة اختيار من متعدد أو صح/خطأ (أي مادة).</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد كشف الستار', allowIndividual:true, allowTeams:true, needQuestions:true, qType:['mcq','tf'] }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  questions = EGL.shuffle(bank.questions.filter(q=>q.type==='mcq'||q.type==='tf'));
  if(!questions.length){ EGL.toast('لا توجد أسئلة اختيار/صح-خطأ في هذا البنك'); return; }
  qIdx = 0;
  players = cfg.players;
  activeI = 0;
  pool = EGL.shuffle(PICTURES);
  poolIdx = 0;
  pictureRound = 0;
  PICTURE_ROUNDS = Math.min(3, pool.length);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextPicture();
}

function nextPicture(){
  pictureRound++;
  if(pictureRound > PICTURE_ROUNDS){ showResults(); return; }
  curPicture = pool[poolIdx++];
  tilesLeft = 16;
  document.getElementById('round-badge').textContent = `🖼️ الصورة ${pictureRound} / ${PICTURE_ROUNDS}`;
  renderRound();
}

function nextQuestionInPicture(){
  if(qIdx >= questions.length){ questions = EGL.shuffle(questions); qIdx = 0; }
  renderQuestionCard();
}

function renderRound(){
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="curtain-box" id="curtain-box">
      <div class="curtain-big-emoji">${curPicture.e}</div>
      <div class="curtain-grid" id="curtain-grid"></div>
    </div>
    <div id="q-card-wrap"></div>
    <div style="text-align:center; margin-top:10px;">
      <button class="btn btn-gold" id="btn-guessed">🙋 أحد خمّن الصورة!</button>
    </div>`;
  const grid = document.getElementById('curtain-grid');
  grid.innerHTML = Array.from({length:16}).map(()=>`<div class="curtain-tile">❓</div>`).join('');
  document.getElementById('btn-guessed').addEventListener('click', openGuessCredit);
  nextQuestionInPicture();
}

function renderQuestionCard(){
  const q = questions[qIdx];
  const wrap = document.getElementById('q-card-wrap');
  wrap.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
      <div class="options" id="opts">${q.options.map((o,i)=>`<button class="option-btn" data-i="${i}">${EGL.escapeHtml(o)}</button>`).join('')}</div>
    </div>`;
  wrap.querySelectorAll('.option-btn').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = parseInt(btn.dataset.i);
    wrap.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
    btn.classList.add(i===q.correctIndex?'correct':'wrong');
    wrap.querySelectorAll('.option-btn')[q.correctIndex].classList.add('correct');
    if(i===q.correctIndex){ sb.addScore(activeI, q.points||10); EGL.beep('correct'); revealTiles(1); }
    else EGL.beep('wrong');
    setTimeout(()=>{
      activeI = (activeI+1) % players.length;
      qIdx++;
      if(tilesLeft <= 0){ EGL.toast('🖼️ انكشفت الصورة بالكامل: ' + curPicture.label); setTimeout(nextPicture, 1600); }
      else nextQuestionInPicture();
    }, 1400);
  }));
}

function revealTiles(n){
  const hidden = Array.from(document.querySelectorAll('.curtain-tile:not(.hidden)'));
  EGL.shuffle(hidden).slice(0, n).forEach(t => { t.classList.add('hidden'); tilesLeft--; });
  EGL.confetti(12);
}

function openGuessCredit(){
  const area = document.getElementById('game-area');
  const box = document.createElement('div');
  box.className = 'qcard';
  box.style.marginTop = '10px';
  box.innerHTML = `<p>من خمّن اسم الصورة الصحيح؟ (${EGL.escapeHtml(curPicture.label)})</p>
    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
      ${players.map((p,i)=>`<button class="btn btn-accent btn-sm" data-i="${i}">${p.emoji} ${EGL.escapeHtml(p.name)}</button>`).join('')}
      <button class="btn btn-outline btn-sm" id="btn-nobody">لا أحد أصاب</button>
    </div>`;
  area.appendChild(box);
  box.querySelectorAll('button[data-i]').forEach(btn=>btn.addEventListener('click', ()=>{
    const i = parseInt(btn.dataset.i);
    sb.addScore(i, 30);
    EGL.beep('win'); EGL.confetti(80);
    document.querySelectorAll('.curtain-tile').forEach(t=>t.classList.add('hidden'));
    box.remove();
    setTimeout(nextPicture, 1600);
  }));
  box.querySelector('#btn-nobody').addEventListener('click', ()=> box.remove());
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الصور!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
