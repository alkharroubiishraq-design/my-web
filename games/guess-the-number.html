<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن الرقم — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .range-hint{ text-align:center; font-size:1.1rem; font-weight:800; color: var(--accent-2); margin-bottom:10px; }
  .guess-row{ display:flex; gap:8px; max-width:360px; margin: 14px auto; }
  .guess-row input{ flex:1; padding:14px; border-radius:10px; border:none; background: var(--surface-2); color:#fff; font-family:inherit; font-weight:900; text-align:center; font-size:1.3rem; }
  .feedback-msg{ text-align:center; font-size:1.4rem; font-weight:900; min-height:2em; margin: 10px 0; }
  .history-row{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .history-chip{ background: var(--surface-2); border-radius:8px; padding:4px 10px; font-weight:800; font-size:.8rem; }
  .history-chip.up{ color: var(--accent-2); }
  .history-chip.down{ color: #ff8fae; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🔢 خمّن الرقم</h1>
    <p>لا يحتاج بنك أسئلة! رقم سري بين ١ و١٠٠ — خمّنوه بالتناوب، وكل تخمين يعطيكم تلميح "أعلى" أو "أقل"!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, players, activeI, secret, guesses, round, ROUNDS;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🔢</div><h3>هيّئ اللعبة</h3><p>لا تحتاج بنك أسئلة — فقط أسماء اللاعبين.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد خمّن الرقم', allowIndividual:true, allowTeams:true, skipBank:true, minPlayers:1, maxPlayers:8 }, startGame);
}

function startGame(cfg){
  players = cfg.players;
  activeI = 0;
  round = 0;
  ROUNDS = 3;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin:8px 0;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS){ return showResults(); }
  document.getElementById('round-badge').textContent = `🔢 الجولة ${round} / ${ROUNDS}`;
  startRound();
}

function startRound(){
  secret = 1 + Math.floor(Math.random()*100);
  guesses = [];
  sb.setActive(activeI);
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="range-hint" id="range-hint">النطاق: ١ - ١٠٠</div>
      <div class="feedback-msg" id="feedback"></div>
      <div class="guess-row">
        <input type="number" id="guess-input" min="1" max="100" placeholder="اكتب رقمك...">
        <button class="btn btn-accent" id="btn-guess">تخمين</button>
      </div>
      <div class="history-row" id="history"></div>
    </div>`;
  document.getElementById('btn-guess').addEventListener('click', submitGuess);
  document.getElementById('guess-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitGuess(); });
}

function submitGuess(){
  const input = document.getElementById('guess-input');
  const val = parseInt(input.value, 10);
  if(isNaN(val) || val < 1 || val > 100){ EGL.toast('اكتب رقمًا بين ١ و١٠٠'); return; }
  guesses.push(val);
  input.value = '';
  const history = document.getElementById('history');
  if(val === secret){
    EGL.beep('correct'); EGL.confetti(80);
    const points = Math.max(5, 30 - guesses.length*4);
    sb.addScore(activeI, points);
    document.getElementById('feedback').innerHTML = `🎉 صحيح! الرقم كان ${secret} — بعد ${guesses.length} محاولة/محاولات (+${points})`;
    document.getElementById('btn-guess').disabled = true;
    input.disabled = true;
    setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 2200);
    return;
  }
  const up = val < secret;
  history.innerHTML += `<span class="history-chip ${up?'up':'down'}">${val} ${up?'⬆️':'⬇️'}</span>`;
  document.getElementById('feedback').textContent = up ? '⬆️ الرقم السري أكبر من هذا!' : '⬇️ الرقم السري أصغر من هذا!';
  EGL.beep('tick');
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
