<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكلمة السرية — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .secret-word{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin: 18px 0; }
  .letter-box{ width:44px; height:54px; border-radius:10px; background: var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:900; border-bottom:3px solid var(--primary); }
  .letter-box.space{ background:transparent; border:none; width:20px; }
  .kb{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:720px; margin: 10px auto; }
  .kb button{ min-width:42px; padding:10px 8px; border-radius:10px; border:none; background: var(--surface-2); color:#fff; font-family:inherit; font-weight:800; font-size:1rem; cursor:pointer; }
  .kb button:hover{ background: var(--primary); }
  .kb button.used-correct{ background: rgba(43,224,138,.3); color: var(--success); cursor:default; }
  .kb button.used-wrong{ background: rgba(255,92,92,.3); color: var(--danger); cursor:default; }
  .lives-emoji{ font-size:3.4rem; text-align:center; margin-bottom:6px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🧩 الكلمة السرية</h1>
    <p>خمّنوا الحروف قبل نفاد المحاولات — كل حرف صحيح نقاط، وكل خطأ يقرّبكم من الخسارة!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const AR_ALPHA = ['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي','ة','ى','ء','ئ','ؤ'];
const EN_ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const MAX_LIVES = 6;
const LIFE_EMOJI = ['💀','😱','😧','😟','😐','🙂','😀'];
const ROUNDS = 6;
let sb, players, activeI, pool, poolIdx, round, secret, clue, revealed, guessed, lives, roundOver;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🧩</div><h3>هيّئ اللعبة</h3><p>يمكن اللعب فرديًا بالتناوب أو بين عدة فرق.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد الكلمة السرية', allowIndividual:true, allowTeams:true, needQuestions:true }, startGame);
}

function normalize(ch){ return ch.replace(/[أإآ]/g, 'ا'); }
function isGuessable(ch){ return /[ء-يةىa-zA-Z]/.test(ch); }

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const eligible = bank.questions.filter(q => q.answerText && q.answerText.trim().length >= 2 && q.answerText.trim().length <= 22);
  if(eligible.length < 3){ EGL.toast('تحتاج هذه اللعبة أسئلة ذات إجابات نصية قصيرة (٣ على الأقل) — أضف المزيد للبنك'); return; }
  pool = EGL.shuffle(eligible);
  poolIdx = 0;
  players = cfg.players;
  activeI = 0;
  round = 0;

  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:10px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS || poolIdx >= pool.length){ showFinalResults(); return; }
  const q = pool[poolIdx++];
  secret = q.answerText.trim();
  clue = q.text;
  guessed = new Set();
  lives = MAX_LIVES;
  roundOver = false;
  document.getElementById('round-badge').textContent = `🧩 الجولة ${round} / ${ROUNDS}`;
  renderRound();
}

function renderRound(){
  const area = document.getElementById('game-area');
  const usesLatin = /[a-zA-Z]/.test(secret);
  const alphabet = usesLatin ? EN_ALPHA : AR_ALPHA;
  area.innerHTML = `
    <div class="qcard">
      <p style="font-weight:700;">💡 التلميح: ${EGL.escapeHtml(clue)}</p>
      <div class="lives-emoji" id="lives-emoji"></div>
      <div class="secret-word" id="secret-word"></div>
      <p>دور التخمين: <strong style="color:var(--accent-2)">${players[activeI].emoji} ${EGL.escapeHtml(players[activeI].name)}</strong></p>
      <div class="kb" id="kb"></div>
    </div>`;
  const kb = document.getElementById('kb');
  kb.innerHTML = alphabet.map(l => `<button data-l="${l}">${l}</button>`).join('');
  kb.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => guessLetter(btn.dataset.l, btn)));
  renderWord();
  renderLives();
}

function renderWord(){
  const wrap = document.getElementById('secret-word');
  wrap.innerHTML = secret.split('').map(ch => {
    if(ch === ' ') return `<div class="letter-box space"></div>`;
    if(!isGuessable(ch)) return `<div class="letter-box">${ch}</div>`;
    const shown = guessed.has(normalize(ch));
    return `<div class="letter-box">${shown ? ch : ''}</div>`;
  }).join('');
}

function renderLives(){
  document.getElementById('lives-emoji').textContent = LIFE_EMOJI[Math.max(0, lives)] || '💀';
}

function guessLetter(letter, btnEl){
  if(roundOver) return;
  const norm = normalize(letter);
  if(guessed.has(norm)) return;
  guessed.add(norm);
  const found = secret.split('').some(ch => isGuessable(ch) && normalize(ch) === norm);
  if(found){
    btnEl.classList.add('used-correct');
    sb.addScore(activeI, 5);
    EGL.beep('correct');
  } else {
    btnEl.classList.add('used-wrong');
    lives--;
    EGL.beep('wrong');
  }
  btnEl.disabled = true;
  renderWord();
  renderLives();

  const allRevealed = secret.split('').every(ch => !isGuessable(ch) || guessed.has(normalize(ch)));
  if(allRevealed){
    roundOver = true;
    sb.addScore(activeI, 20);
    EGL.confetti(50); EGL.beep('win');
    EGL.toast(`🎉 تم كشف الكلمة: ${secret}`);
    setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 2200);
    return;
  }
  if(lives <= 0){
    roundOver = true;
    document.querySelectorAll('#kb button').forEach(b=>b.disabled=true);
    EGL.toast(`💥 انتهت المحاولات! الكلمة كانت: ${secret}`);
    setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 2200);
    return;
  }
  activeI = (activeI + 1) % players.length;
  const nameEl = document.querySelector('#game-area p strong');
  if(nameEl) nameEl.parentElement.innerHTML = `دور التخمين: <strong style="color:var(--accent-2)">${players[activeI].emoji} ${EGL.escapeHtml(players[activeI].name)}</strong>`;
}

function showFinalResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
