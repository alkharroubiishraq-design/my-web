<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيتزا الكسور — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .slice-list{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin: 16px 0; }
  .slice-tile{ background: var(--surface-2); border-radius:16px; padding:14px 18px; cursor:pointer; border:3px solid transparent; transition:.15s; text-align:center; min-width:90px; }
  .slice-tile:hover{ border-color: var(--primary); }
  .slice-tile.locked{ background: rgba(43,224,138,.2); border-color: var(--success); cursor:default; }
  .slice-tile.wrong-flash{ background: rgba(255,92,92,.35); border-color: var(--danger); }
  .slice-emoji{ font-size:2.2rem; }
  .slice-frac{ font-weight:900; font-size:1.1rem; margin-top:4px; }
  .slice-tile .rank-num{ display:inline-flex; width:22px; height:22px; border-radius:50%; background: var(--accent-2); color:#332400; align-items:center; justify-content:center; font-weight:900; font-size:.78rem; margin-bottom:4px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🍕 بيتزا الكسور</h1>
    <p>لا يحتاج بنك أسئلة! رتّبوا شرائح البيتزا حسب حجم كسرها من الأصغر إلى الأكبر بأسرع وقت وأقل خطأ.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, players, activeI, round, ROUNDS, fracs, expectedIdx, mistakes, roundStart;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🍕</div><h3>هيّئ اللعبة</h3><p>كسور تُولَّد تلقائيًا — لا تحتاج بنك أسئلة إطلاقًا.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد بيتزا الكسور', allowIndividual:true, allowTeams:true, skipBank:true, minPlayers:1, maxPlayers:6 }, startGame);
}

function startGame(cfg){
  players = cfg.players;
  activeI = 0;
  round = 0;
  ROUNDS = 8;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextRound();
}

function genFractions(){
  const seen = new Set();
  const list = [];
  let guard = 0;
  while(list.length < 4 && guard < 200){
    guard++;
    const den = 2 + Math.floor(Math.random()*9);
    const num = 1 + Math.floor(Math.random()*(den-1));
    const val = num/den;
    const key = val.toFixed(4);
    if(seen.has(key)) continue;
    seen.add(key);
    list.push({ num, den, val, label: `${num}/${den}` });
  }
  return list;
}

function nextRound(){
  round++;
  if(round > ROUNDS){ return showResults(); }
  document.getElementById('round-badge').textContent = `🍕 الجولة ${round} / ${ROUNDS}`;
  renderRound();
}

function renderRound(){
  fracs = genFractions();
  expectedIdx = 0;
  mistakes = 0;
  roundStart = performance.now();
  const sortedAsc = [...fracs].sort((a,b)=>a.val-b.val);
  window._sortedAsc = sortedAsc;
  const shuffled = EGL.shuffle(fracs);
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <p class="hint">رتّبوا شرائح البيتزا من الأصغر كسرًا للأكبر (اضغطوا بالترتيب الصحيح):</p>
      <div class="slice-list" id="slice-list"></div>
    </div>`;
  const list = document.getElementById('slice-list');
  list.innerHTML = shuffled.map(f=>`<div class="slice-tile" data-label="${f.label}"><div class="slice-emoji">🍕</div><div class="slice-frac">${f.label}</div></div>`).join('');
  list.querySelectorAll('.slice-tile').forEach(tile=>tile.addEventListener('click', ()=>tapSlice(tile)));
}

function tapSlice(tile){
  if(tile.classList.contains('locked')) return;
  const label = tile.dataset.label;
  const expected = window._sortedAsc[expectedIdx].label;
  if(label === expected){
    tile.classList.add('locked');
    tile.innerHTML = `<span class="rank-num">${expectedIdx+1}</span><div class="slice-emoji">🍕</div><div class="slice-frac">${label}</div>`;
    EGL.beep('tick');
    expectedIdx++;
    if(expectedIdx === fracs.length) roundComplete();
  } else {
    mistakes++;
    tile.classList.add('wrong-flash');
    EGL.beep('wrong');
    setTimeout(()=> tile.classList.remove('wrong-flash'), 400);
  }
}

function roundComplete(){
  const elapsed = (performance.now() - roundStart)/1000;
  const speedBonus = Math.max(0, Math.round(10 - elapsed));
  const points = Math.max(5, 16 - mistakes*3) + speedBonus;
  sb.addScore(activeI, points);
  EGL.beep('correct'); EGL.confetti(45);
  EGL.toast(`✅ ترتيب صحيح! +${points} نقطة`);
  setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 1700);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
