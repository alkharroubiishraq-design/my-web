<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صياد الكلمات — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .hunt-passage{ background: var(--bg-soft); border-radius: var(--radius-sm); padding:18px 22px; margin: 16px 0; text-align:right; line-height:2.6; font-size:1.05rem; border: 1px dashed rgba(255,255,255,.15); }
  .hunt-word{ cursor:pointer; padding:2px 4px; border-radius:6px; transition:.15s; }
  .hunt-word:hover{ background: rgba(124,92,255,.25); }
  .hunt-word.found{ background: rgba(43,224,138,.35); }
  .hunt-word.wrong-flash{ background: rgba(255,92,92,.35); }
  .targets-left{ text-align:center; font-weight:800; margin-bottom:6px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🎯 صياد الكلمات</h1>
    <p>انقروا كل الكلمات المطلوبة داخل النص (أفعال، صفات، أو أي فئة نحوية) قبل نفاد الوقت!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, players, activeI, pool, poolIdx, round, ROUNDS, targetsRemaining, roundStart, timerInt, timeLeft;
const ROUND_TIME = 30;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🎯</div><h3>هيّئ اللعبة</h3><p>أنشئ سؤالًا مفتوحًا مع نص مرجعي (فقرة)، واجعل "الإجابة النموذجية" قائمة الكلمات المطلوبة مفصولة بفواصل، مثل: ذهب,لعب,أكل</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد صياد الكلمات', allowIndividual:true, allowTeams:true, needQuestions:true, qType:['open'] }, startGame);
}

function normalizeWord(w){ return w.trim().replace(/[.,،؛؟!"'()«»]+$/g,'').replace(/^[.,،؛؟!"'()«»]+/g,''); }

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const eligible = bank.questions.filter(q => q.type==='open' && q.context && q.answerText && q.answerText.includes(','));
  const singleTarget = bank.questions.filter(q => q.type==='open' && q.context && q.answerText && !q.answerText.includes(',') && q.context.split(/\s+/).some(w=>normalizeWord(w)===normalizeWord(q.answerText)));
  pool = EGL.shuffle([...eligible, ...singleTarget]);
  if(!pool.length){ EGL.toast('لا توجد أسئلة صيد كلمات (سؤال مفتوح + نص مرجعي + إجابة تحوي الكلمات المطلوبة)'); return; }
  poolIdx = 0;
  players = cfg.players;
  activeI = 0;
  round = 0;
  ROUNDS = Math.min(8, pool.length);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS || poolIdx >= pool.length){ showResults(); return; }
  document.getElementById('round-badge').textContent = `🎯 الجولة ${round} / ${ROUNDS}`;
  renderRound();
}

function renderRound(){
  clearInterval(timerInt);
  const q = pool[poolIdx++];
  const targets = q.answerText.split(',').map(normalizeWord).filter(Boolean);
  targetsRemaining = new Set(targets);
  const words = q.context.split(/\s+/);
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
      <div class="targets-left" id="targets-left">المتبقي: ${targetsRemaining.size}</div>
      <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
      <div class="hunt-passage" id="passage"></div>
    </div>`;
  const passage = document.getElementById('passage');
  passage.innerHTML = words.map((w,i)=>`<span class="hunt-word" data-i="${i}" data-w="${EGL.escapeHtml(normalizeWord(w))}">${EGL.escapeHtml(w)} </span>`).join('');
  passage.querySelectorAll('.hunt-word').forEach(sp=>sp.addEventListener('click', ()=>clickWord(sp)));

  roundStart = performance.now();
  timeLeft = ROUND_TIME;
  timerInt = setInterval(()=>{
    timeLeft--;
    const fill = document.getElementById('timer-fill');
    if(fill) fill.style.width = (timeLeft/ROUND_TIME*100)+'%';
    if(timeLeft<=0) endRound(false);
  }, 1000);
}

function clickWord(sp){
  if(sp.classList.contains('found')) return;
  const w = sp.dataset.w;
  if(targetsRemaining.has(w)){
    sp.classList.add('found');
    targetsRemaining.delete(w);
    EGL.beep('correct');
    document.getElementById('targets-left').textContent = `المتبقي: ${targetsRemaining.size}`;
    if(targetsRemaining.size === 0) endRound(true);
  } else {
    sp.classList.add('wrong-flash');
    EGL.beep('wrong');
    setTimeout(()=> sp.classList.remove('wrong-flash'), 350);
  }
}

function endRound(success){
  clearInterval(timerInt);
  document.querySelectorAll('.hunt-word').forEach(sp=>sp.style.pointerEvents='none');
  if(success){
    const elapsed = (performance.now()-roundStart)/1000;
    const bonus = Math.max(0, Math.round(ROUND_TIME-elapsed));
    sb.addScore(activeI, 20 + bonus);
    EGL.confetti(50); EGL.beep('win');
  } else {
    EGL.toast('⏱ انتهى الوقت!');
    EGL.beep('wrong');
  }
  setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 1600);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت المطاردة!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
