<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شد الحبل المعرفي — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪢</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .rope-track{ position:relative; width:100%; max-width:760px; height:70px; margin: 20px auto; background: var(--surface-2); border-radius: 999px; overflow:hidden; }
  .rope-track::before{ content:''; position:absolute; top:50%; right:0; left:0; height:6px; background: repeating-linear-gradient(90deg, #8a5a2a 0 14px, #6a3f18 14px 28px); transform: translateY(-50%); }
  .rope-marker{ position:absolute; top:50%; width:56px; height:56px; transform:translate(50%,-50%); font-size:2.2rem; display:flex; align-items:center; justify-content:center; transition: right 1s ease; }
  .rope-end{ position:absolute; top:50%; transform:translateY(-50%); font-size:1.6rem; font-weight:900; }
  .rope-end.left{ left:14px; } .rope-end.right{ right:14px; }
  .zones2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:760px; margin:16px auto; }
  .zone{ border-radius: var(--radius); padding: 16px 10px; text-align:center; box-shadow: var(--shadow); border:2px solid rgba(255,255,255,.08); }
  .zone .tf-btns{ display:flex; gap:8px; margin-top:10px; }
  .zone .tf-btns button{ flex:1; padding:14px 6px; border-radius:12px; border:none; font-weight:900; cursor:pointer; color:#fff; }
  .tf-true{ background: var(--success); } .tf-false{ background: var(--danger); }
  .countdown-overlay{ position:fixed; inset:0; background: rgba(5,6,20,.88); display:flex; align-items:center; justify-content:center; z-index:250; }
  .countdown-num{ font-size: 9rem; font-weight:900; color: var(--accent-2); text-shadow: 0 0 40px rgba(255,210,63,.6); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🪢 شد الحبل المعرفي</h1>
    <p>فريقان يجيبان بنفس اللحظة — الأسرع في الإجابة الصحيحة يسحب الحبل نحوه!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const RANGE = 6;
let players, questions, qIdx, position, zoneAnswered, roundStart, timerInt, timeLeft;
const ANSWER_TIME = 6;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🪢</div><h3>هيّئ اللعبة</h3><p>لعبة فريقين (2 فقط) تحتاج بنك أسئلة صح/خطأ.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد شد الحبل المعرفي', allowIndividual:false, allowTeams:true, needQuestions:true, qType:['tf'], minPlayers:2, maxPlayers:2 }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  questions = EGL.shuffle(bank.questions.filter(q=>q.type==='tf'));
  if(!questions.length){ EGL.toast('لا توجد أسئلة صح/خطأ في هذا البنك'); return; }
  players = cfg.players;
  position = 0;
  qIdx = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="rope-track" id="track">
      <div class="rope-end left">${players[0].emoji}</div>
      <div class="rope-end right">${players[1].emoji}</div>
      <div class="rope-marker" id="marker">🪢</div>
    </div>
    <div id="progress-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div>
    <div id="game-area"></div>`;
  updateMarker();
  nextQuestion();
}

function updateMarker(){
  const pct = 50 - (position/RANGE)*44;
  document.getElementById('marker').style.right = pct + '%';
}

function nextQuestion(){
  if(qIdx >= questions.length){ questions = EGL.shuffle(questions); qIdx = 0; }
  document.getElementById('progress-badge').textContent = `🪢 السؤال ${qIdx+1}`;
  renderQuestion();
}

function renderQuestion(){
  clearInterval(timerInt);
  const q = questions[qIdx];
  window._curQ = q;
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard" style="margin-bottom:10px;">
      <div class="qtext" id="shared-q" style="visibility:hidden;">${EGL.escapeHtml(q.text)}</div>
      <div style="text-align:center;"><button class="btn btn-gold" id="btn-reveal">⚡ اعرض السؤال!</button></div>
    </div>
    <div class="zones2" id="zones"></div>`;
  const zonesEl = document.getElementById('zones');
  zonesEl.innerHTML = players.map((p,i)=>`
    <div class="zone" id="zone-${i}">
      <div style="font-weight:900;">${p.emoji} ${EGL.escapeHtml(p.name)}</div>
      <div class="tf-btns">
        <button class="tf-true" data-i="${i}" data-v="true" disabled>✅ صح</button>
        <button class="tf-false" data-i="${i}" data-v="false" disabled>❌ خطأ</button>
      </div>
      <div class="result-tag" id="result-${i}" style="min-height:18px; font-size:.78rem; font-weight:800; margin-top:6px;"></div>
    </div>`).join('');
  zonesEl.querySelectorAll('.tf-btns button').forEach(btn=>{
    btn.addEventListener('click', ()=> zoneAnswer(parseInt(btn.dataset.i), btn.dataset.v === 'true'));
  });
  document.getElementById('btn-reveal').addEventListener('click', startCountdown);
}

function startCountdown(){
  document.getElementById('btn-reveal').disabled = true;
  let n = 3;
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  overlay.innerHTML = `<div class="countdown-num" id="cd-num">${n}</div>`;
  document.body.appendChild(overlay);
  EGL.beep('tick');
  const iv = setInterval(()=>{
    n--;
    if(n>0){ overlay.querySelector('#cd-num').textContent = n; EGL.beep('tick'); }
    else {
      overlay.querySelector('#cd-num').textContent = 'اسحب! 🪢';
      overlay.querySelector('#cd-num').style.fontSize = '5rem';
      EGL.beep('win');
      clearInterval(iv);
      setTimeout(()=>{ overlay.remove(); openAnswering(); }, 500);
    }
  }, 650);
}

function openAnswering(){
  document.getElementById('shared-q').style.visibility = 'visible';
  document.querySelectorAll('.tf-btns button').forEach(b=>b.disabled=false);
  zoneAnswered = players.map(()=>null);
  roundStart = performance.now();
  timeLeft = ANSWER_TIME;
  timerInt = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0) resolveRound();
  }, 1000);
}

function zoneAnswer(i, val){
  if(!zoneAnswered || zoneAnswered[i] !== null) return;
  const t = performance.now() - roundStart;
  zoneAnswered[i] = { val, t };
  document.querySelectorAll(`.zone`)[i].querySelectorAll('.tf-btns button').forEach(b=>b.disabled=true);
  document.getElementById('result-'+i).textContent = `⏱ ${(t/1000).toFixed(2)} ث`;
  EGL.beep('tick');
  if(zoneAnswered.every(z=>z!==null)) resolveRound();
}

function resolveRound(){
  clearInterval(timerInt);
  const q = window._curQ;
  document.querySelectorAll('.tf-btns button').forEach(b=>b.disabled=true);
  const correctFlags = [0,1].map(i => zoneAnswered[i] && (zoneAnswered[i].val === (q.correctIndex===0)));
  let winner = -1;
  if(correctFlags[0] && correctFlags[1]) winner = zoneAnswered[0].t <= zoneAnswered[1].t ? 0 : 1;
  else if(correctFlags[0]) winner = 0;
  else if(correctFlags[1]) winner = 1;
  players.forEach((p,i)=>{
    const el = document.getElementById('result-'+i);
    if(!zoneAnswered[i]) el.textContent = '⏱ لم يُجب';
    else el.textContent += correctFlags[i] ? ' ✅' : ' ❌';
  });
  if(winner > -1){
    position += (winner === 0 ? 1 : -1);
    updateMarker();
    EGL.beep('correct'); EGL.confetti(25);
  } else {
    EGL.beep('wrong');
  }
  if(position >= RANGE){ setTimeout(()=>showResults(0), 1200); return; }
  if(position <= -RANGE){ setTimeout(()=>showResults(1), 1200); return; }
  qIdx++;
  setTimeout(nextQuestion, 1800);
}

function showResults(winnerI){
  EGL.confetti(120); EGL.beep('win');
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div>
    <h2>${players[winnerI].emoji} ${EGL.escapeHtml(players[winnerI].name)} سحب الحبل بالكامل وفاز!</h2>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
