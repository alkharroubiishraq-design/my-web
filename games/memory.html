<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الذاكرة — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .mem-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap:12px; width:100%; max-width:920px; margin:0 auto; }
  .mem-card{ aspect-ratio: 1/.85; border-radius:14px; cursor:pointer; position:relative; perspective:800px; }
  .mem-card-inner{ position:relative; width:100%; height:100%; transition: transform .5s; transform-style:preserve-3d; }
  .mem-card.flipped .mem-card-inner, .mem-card.matched .mem-card-inner{ transform: rotateY(180deg); }
  .mem-face{ position:absolute; inset:0; border-radius:14px; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; padding:8px; text-align:center; font-weight:700; font-size:.82rem; }
  .mem-back{ background: var(--grad-1); font-size:1.8rem; }
  .mem-front{ background: var(--surface-2); transform: rotateY(180deg); color:#fff; }
  .mem-card.matched .mem-front{ background: rgba(43,224,138,.25); border: 2px solid var(--success); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🧠 لعبة الذاكرة</h1>
    <p>اقلب البطاقات وطابق كل سؤال مع إجابته الصحيحة.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, cards, flipped=[], lock=false, matchedPairs=0, totalPairs;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🧠</div><h3>هيّئ اللعبة</h3><p>يمكن اللعب فرديًا أو بالتناوب بين عدة لاعبين/فرق.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({
    title:'إعداد لعبة الذاكرة', allowIndividual:true, allowTeams:true, needQuestions:true,
    extraFieldsHtml: `<label>عدد الأزواج</label><select data-extra="pairs"><option value="6">6 أزواج (سهل)</option><option value="8" selected>8 أزواج (متوسط)</option><option value="10">10 أزواج (صعب)</option></select>`
  }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const eligible = bank.questions.filter(q => q.answerText && q.answerText.trim() && q.answerText.trim() !== q.text.trim());
  const pairsWanted = parseInt(cfg.extra.pairs) || 8;
  const chosen = EGL.shuffle(eligible).slice(0, pairsWanted);
  if(chosen.length < 3){ EGL.toast('تحتاج هذه اللعبة أسئلة ذات إجابات واضحة (اختيار من متعدد أو صح/خطأ) — أضف المزيد للبنك'); return; }
  totalPairs = chosen.length;
  matchedPairs = 0;
  cards = EGL.shuffle(chosen.flatMap(q => [
    { key:q.id, label:q.text, kind:'q' },
    { key:q.id, label:q.answerText, kind:'a' }
  ])).map((c,i)=>({...c, idx:i}));

  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div>
    <p class="hint" style="text-align:center;">تطابقات: <span id="match-count">0</span> / ${totalPairs}</p>
    <div class="mem-grid" id="mem-grid"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), cfg.players);

  const grid = document.getElementById('mem-grid');
  grid.innerHTML = cards.map(c => `
    <div class="mem-card" data-idx="${c.idx}">
      <div class="mem-card-inner">
        <div class="mem-face mem-back">❓</div>
        <div class="mem-face mem-front">${EGL.escapeHtml(c.label)}</div>
      </div>
    </div>`).join('');
  grid.querySelectorAll('.mem-card').forEach(el => el.addEventListener('click', () => flipCard(el)));
}

function flipCard(el){
  if(lock) return;
  const idx = parseInt(el.dataset.idx);
  if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
  el.classList.add('flipped');
  flipped.push({el, idx});
  EGL.beep('tick');
  if(flipped.length === 2) checkMatch();
}

function checkMatch(){
  lock = true;
  const [a,b] = flipped;
  const ca = cards[a.idx], cb = cards[b.idx];
  if(ca.key === cb.key){
    setTimeout(()=>{
      a.el.classList.add('matched'); b.el.classList.add('matched');
      matchedPairs++;
      document.getElementById('match-count').textContent = matchedPairs;
      sb.addScore(sb.activeIndex(), 10);
      EGL.beep('correct'); EGL.confetti(18);
      flipped = []; lock = false;
      if(matchedPairs === totalPairs) setTimeout(showResults, 500);
    }, 500);
  } else {
    EGL.beep('wrong');
    setTimeout(()=>{
      a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
      flipped = []; lock = false;
      if(sb.players.length > 1) sb.nextTurn();
    }, 900);
  }
}

function showResults(){
  EGL.confetti(90); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>أحسنتم! تم إيجاد كل الأزواج</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
