<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استطلاع الصف السريع — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .poll-q{ text-align:center; font-size:1.4rem; font-weight:900; margin: 10px 0 18px; }
  .poll-options{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .poll-option{ background: var(--surface-2); border-radius:14px; padding:16px 22px; cursor:pointer; border:3px solid transparent; font-weight:800; font-size:1.05rem; transition:.15s; }
  .poll-option:hover{ border-color: var(--primary); }
  .poll-option.picked{ border-color: var(--accent-2); }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; max-width:560px; margin-inline:auto; }
  .bar-label{ flex:0 0 140px; font-weight:800; font-size:.9rem; }
  .bar-track{ flex:1; background: var(--surface); border-radius:8px; overflow:hidden; height:26px; }
  .bar-fill{ height:100%; background: var(--primary); transition: width .6s ease; }
  .bar-count{ flex:0 0 30px; font-weight:900; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>📊 استطلاع الصف السريع</h1>
    <p>لا يحتاج بنك أسئلة! سؤال طريف يصوّت عليه الجميع، ثم نكشف النتائج على شكل رسم بياني فوري.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const POLLS = [
  { q:'أيّهم تفضّل؟', opts:['🍕 بيتزا','🍔 برجر','🌮 تاكو','🍜 نودلز'] },
  { q:'أفضل وقت باليوم؟', opts:['🌅 الصباح','🌇 المساء','🌙 الليل'] },
  { q:'لو عندك قوة خارقة، أيّها تختار؟', opts:['✈️ الطيران','👻 الاختفاء','💪 القوة الخارقة','⏱️ إيقاف الزمن'] },
  { q:'أفضل فصل من فصول السنة؟', opts:['☀️ الصيف','🍂 الخريف','❄️ الشتاء','🌸 الربيع'] },
  { q:'مكان تحلم بزيارته؟', opts:['🏔️ الجبال','🏖️ الشاطئ','🏙️ مدينة كبيرة','🌲 الغابة'] },
  { q:'أفضل نشاط في وقت الفراغ؟', opts:['📚 القراءة','🎮 الألعاب','⚽ الرياضة','🎨 الرسم'] },
];
let players, pollIdx, ROUNDS, votes, voted;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">📊</div><h3>هيّئ اللعبة</h3><p>لا تحتاج بنك أسئلة — فقط أسماء المصوّتين.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد استطلاع الصف السريع', allowIndividual:true, allowTeams:false, skipBank:true, minPlayers:2, maxPlayers:10 }, startGame);
}

function startGame(cfg){
  players = cfg.players;
  pollIdx = 0;
  ROUNDS = Math.min(5, POLLS.length);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="badge" id="round-badge" style="display:block; text-align:center; margin-bottom:8px;"></div><div id="game-area"></div>`;
  nextPoll();
}

function nextPoll(){
  if(pollIdx >= ROUNDS){ return showFinal(); }
  document.getElementById('round-badge').textContent = `📊 الاستطلاع ${pollIdx+1} / ${ROUNDS}`;
  renderPoll();
}

function renderPoll(){
  const poll = POLLS[pollIdx];
  votes = poll.opts.map(()=>0);
  voted = players.map(()=>null);
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="poll-q">${EGL.escapeHtml(poll.q)}</div>
      <div class="poll-options" id="poll-options">${poll.opts.map((o,oi)=>`<div class="poll-option" data-oi="${oi}">${EGL.escapeHtml(o)}</div>`).join('')}</div>
      <p class="hint" style="text-align:center; margin-top:10px;">كل طالب يضغط خياره (بالتناوب على نفس الشاشة)</p>
      <div style="text-align:center; margin-top:10px;"><span class="badge" id="votes-badge">صوّت: 0 / ${players.length}</span></div>
      <div style="text-align:center; margin-top:14px;"><button class="btn btn-gold" id="btn-reveal">📊 اعرض النتائج</button></div>
    </div>`;
  document.querySelectorAll('.poll-option').forEach(el=>el.addEventListener('click', ()=>castVote(parseInt(el.dataset.oi))));
  document.getElementById('btn-reveal').addEventListener('click', revealResults);
}

function castVote(oi){
  const nextVoter = voted.findIndex(v=>v===null);
  if(nextVoter === -1) return;
  voted[nextVoter] = oi;
  votes[oi]++;
  document.getElementById('votes-badge').textContent = `صوّت: ${voted.filter(v=>v!==null).length} / ${players.length}`;
  EGL.beep('tick');
}

function revealResults(){
  const poll = POLLS[pollIdx];
  document.querySelectorAll('.poll-option').forEach(el=>el.style.pointerEvents='none');
  document.getElementById('btn-reveal').disabled = true;
  const total = Math.max(1, votes.reduce((a,b)=>a+b,0));
  const barsHtml = poll.opts.map((o,oi)=>`
    <div class="bar-row">
      <div class="bar-label">${EGL.escapeHtml(o)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${votes[oi]*100/total}%"></div></div>
      <div class="bar-count">${votes[oi]}</div>
    </div>`).join('');
  const area = document.getElementById('game-area');
  const banner = document.createElement('div');
  banner.className = 'qcard';
  banner.style.marginTop = '14px';
  banner.innerHTML = `<h3 style="text-align:center;">📊 النتائج</h3>${barsHtml}
    <div style="text-align:center; margin-top:14px;"><button class="btn btn-primary" id="btn-next-poll">➡️ الاستطلاع التالي</button></div>`;
  area.appendChild(banner);
  document.getElementById('btn-next-poll').addEventListener('click', ()=>{ pollIdx++; nextPoll(); });
  EGL.beep('win'); EGL.confetti(40);
}

function showFinal(){
  EGL.confetti(120); EGL.beep('win');
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">📊</div>
    <h2>انتهت الاستطلاعات!</h2>
    <p class="hint">شكرًا لمشاركتكم جميعًا في الاستطلاعات السريعة.</p>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 استطلاعات جديدة</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
