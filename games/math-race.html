<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سباق الأرقام — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .track-wrap{ width:100%; max-width:820px; margin: 6px auto 26px; display:flex; flex-direction:column; gap:14px; }
  .lane{ position:relative; background: repeating-linear-gradient(90deg, var(--surface-2) 0 40px, var(--bg-soft) 40px 80px); border-radius:14px; height:56px; border:1px solid rgba(255,255,255,.1); }
  .lane::after{ content:'🏁'; position:absolute; left:6px; top:50%; transform:translateY(-50%); font-size:1.6rem; }
  .lane-name{ position:absolute; right:8px; top:-22px; font-weight:800; font-size:.85rem; color: var(--text-dim); }
  .token{ position:absolute; top:50%; transform:translate(50%,-50%); font-size:1.8rem; transition: right 1s cubic-bezier(.2,.9,.3,1); right:95%; }
  .keypad{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; width:100%; max-width:280px; margin: 16px auto 0; }
  .keypad button{ padding:16px; font-size:1.3rem; font-weight:800; border-radius:12px; border:none; background: var(--surface-2); color:#fff; cursor:pointer; }
  .keypad button:hover{ background: var(--primary); }
  .answer-display{ font-size:2.2rem; font-weight:900; text-align:center; min-height:52px; background: var(--bg-soft); border-radius:12px; padding:8px; margin: 10px auto; max-width:280px; letter-spacing:2px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🧮 سباق الأرقام</h1>
    <p>حلّوا المسائل الحسابية بسرعة — كل إجابة صحيحة تدفعكم للأمام في السباق!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let players, progress, TRACK = 10, activeI = 0, answered = false, curAnswer = '', timerInt, timeLeft, difficulty, TIME_LIMIT = 15;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🧮</div><h3>هيّئ اللعبة</h3><p>مسائل حسابية تُولَّد تلقائيًا حسب مستوى الصعوبة — لا تحتاج بنك أسئلة.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({
    title:'إعداد سباق الأرقام', allowIndividual:true, allowTeams:true, skipBank:true,
    extraFieldsHtml: `<label>مستوى الصعوبة</label><div class="chip-group" id="mr-diff-chips" style="margin-bottom:16px;">
      <div class="chip selected" data-v="easy">سهل (جمع وطرح)</div>
      <div class="chip" data-v="medium">متوسط (+ ضرب)</div>
      <div class="chip" data-v="hard">صعب (+ قسمة)</div>
    </div>
    <input type="hidden" id="mr-diff-value" data-extra="difficulty" value="easy">`
  }, startGame);
  const group = document.getElementById('mr-diff-chips');
  const hidden = document.getElementById('mr-diff-value');
  if(group){
    group.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
      group.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
      hidden.value = c.dataset.v;
    }));
  }
}

function startGame(cfg){
  players = cfg.players;
  difficulty = cfg.extra.difficulty || 'easy';
  progress = players.map(()=>0);
  activeI = 0;

  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="track-wrap" id="track-wrap"></div><div id="q-area" style="width:100%;"></div>`;
  const trackWrap = document.getElementById('track-wrap');
  trackWrap.innerHTML = players.map((p,i)=>`
    <div style="position:relative; margin-top:22px;">
      <div class="lane-name">${p.emoji} ${EGL.escapeHtml(p.name)}</div>
      <div class="lane" id="lane-${i}"><div class="token" id="token-${i}">${p.emoji}</div></div>
    </div>`).join('');
  renderProblem();
}

function renderProblem(){
  clearInterval(timerInt);
  answered = false;
  curAnswer = '';
  timeLeft = TIME_LIMIT;
  window._curProblem = EGL.genMathProblem(difficulty);
  const area = document.getElementById('q-area');
  area.innerHTML = `
    <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div class="qcard">
      <div class="qmeta"><span class="badge">🏎 دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <div class="qtext" style="font-size:2.4rem;">${window._curProblem.text} = ؟</div>
      <div class="answer-display" id="ans-display">_</div>
      <div class="keypad" id="keypad"></div>
    </div>`;
  const kp = document.getElementById('keypad');
  const keys = ['1','2','3','4','5','6','7','8','9','−','0','⌫'];
  kp.innerHTML = keys.map(k=>`<button data-k="${k}">${k}</button>`).join('') + `<button data-k="OK" style="grid-column:span 3; background:var(--grad-2);">✅ تأكيد</button>`;
  kp.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>pressKey(btn.dataset.k)));

  timerInt = setInterval(()=>{
    timeLeft--;
    const fill = document.getElementById('timer-fill');
    if(fill) fill.style.width = (timeLeft/TIME_LIMIT*100)+'%';
    if(timeLeft<=0) submitAnswer();
  }, 1000);
}

function pressKey(k){
  if(answered) return;
  if(k === '⌫') curAnswer = curAnswer.slice(0,-1);
  else if(k === 'OK') { submitAnswer(); return; }
  else if(k === '−') { if(!curAnswer.includes('−')) curAnswer = '−' + curAnswer; }
  else if(curAnswer.length < 6) curAnswer += k;
  document.getElementById('ans-display').textContent = curAnswer || '_';
}

function submitAnswer(){
  if(answered) return;
  answered = true;
  clearInterval(timerInt);
  document.querySelectorAll('.keypad button').forEach(b=>b.disabled=true);
  const numeric = parseInt((curAnswer || '').replace('−','-')) ;
  const correct = numeric === window._curProblem.answer;
  const display = document.getElementById('ans-display');
  if(correct){
    display.style.color = 'var(--success)';
    const roll = 2 + Math.floor(Math.random()*2);
    progress[activeI] = Math.min(TRACK, progress[activeI] + roll);
    moveToken(activeI);
    EGL.beep('correct'); EGL.confetti(16);
  } else {
    display.style.color = 'var(--danger)';
    display.textContent = (curAnswer || '(بدون إجابة)') + ` ❌ الصحيح: ${window._curProblem.answer}`;
    EGL.beep('wrong');
  }
  setTimeout(()=>{
    if(progress[activeI] >= TRACK){ finishRace(activeI); return; }
    activeI = (activeI + 1) % players.length;
    renderProblem();
  }, 1500);
}

function moveToken(i){
  const token = document.getElementById('token-'+i);
  const pct = 8 + (progress[i]/TRACK) * 88;
  token.style.right = pct + '%';
}

function finishRace(winnerI){
  EGL.confetti(120); EGL.beep('win');
  const area = document.getElementById('q-area');
  area.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div>
    <h2>${EGL.escapeHtml(players[winnerI].emoji)} ${EGL.escapeHtml(players[winnerI].name)} يفوز بسباق الأرقام!</h2>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 سباق جديد</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
