<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدار الامتنان — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .wall-grid{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin: 18px 0; min-height:120px; }
  .sticky-note{ background: linear-gradient(160deg, #ffe08a, #f0c14a); color:#3a2a05; border-radius:6px; padding:14px; width:150px; min-height:100px; font-weight:800; font-size:.85rem; box-shadow: 0 6px 14px rgba(0,0,0,.25); transform: rotate(var(--rot, -2deg)); }
  .sticky-note .sn-by{ display:block; margin-top:8px; font-size:.7rem; opacity:.7; }
  .add-row{ display:flex; gap:8px; max-width:480px; margin: 0 auto; }
  .add-row input{ flex:1; padding:12px; border-radius:10px; border:none; background: var(--surface-2); color:#fff; font-family:inherit; font-weight:700; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🌟 جدار الامتنان</h1>
    <p>لا يحتاج بنك أسئلة! كل طالب بدوره يكتب شيئًا واحدًا يشعره بالامتنان، وتتراكم الملاحظات على جدار جماعي جميل.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let players, turnI, notes, TARGET;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🌟</div><h3>هيّئ اللعبة</h3><p>لا تحتاج بنك أسئلة — فقط أسماء المشاركين بالترتيب.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد جدار الامتنان', allowIndividual:true, allowTeams:false, skipBank:true, minPlayers:2, maxPlayers:10 }, startGame);
}

function startGame(cfg){
  players = cfg.players;
  turnI = 0;
  notes = [];
  TARGET = players.length;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="badge" id="progress-badge" style="display:block; text-align:center; margin-bottom:8px;"></div>
    <div class="wall-grid" id="wall"></div>
    <div class="badge" id="turn-badge" style="display:block; text-align:center; margin-bottom:8px;"></div>
    <div class="add-row">
      <input type="text" id="note-input" placeholder="أنا ممتن لـ..." maxlength="60">
      <button class="btn btn-gold" id="btn-add">🌟 أضف</button>
    </div>`;
  document.getElementById('btn-add').addEventListener('click', addNote);
  document.getElementById('note-input').addEventListener('keydown', e=>{ if(e.key==='Enter') addNote(); });
  updateBadges();
}

function updateBadges(){
  document.getElementById('progress-badge').textContent = `🌟 عدد الملاحظات: ${notes.length} / ${TARGET}`;
  const p = players[turnI];
  document.getElementById('turn-badge').innerHTML = `🎯 دور: <span style="color:var(--accent-2)">${p.emoji} ${EGL.escapeHtml(p.name)}</span>`;
}

function addNote(){
  const input = document.getElementById('note-input');
  const val = input.value.trim();
  if(!val) return;
  notes.push({ text: val, by: players[turnI] });
  input.value = '';
  renderWall();
  EGL.beep('tick'); EGL.confetti(15);
  turnI = (turnI + 1) % players.length;
  if(notes.length >= TARGET){ return finishWall(); }
  updateBadges();
}

function renderWall(){
  const wall = document.getElementById('wall');
  wall.innerHTML = notes.map((n,i)=>`
    <div class="sticky-note" style="--rot: ${(i%2===0?-1:1)*(2+Math.random()*3)}deg;">
      ${EGL.escapeHtml(n.text)}
      <span class="sn-by">${n.by.emoji} ${EGL.escapeHtml(n.by.name)}</span>
    </div>`).join('');
}

function finishWall(){
  EGL.confetti(150); EGL.beep('win');
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🌟</div>
    <h2>جدار الامتنان الكامل!</h2>
    <div class="wall-grid">${notes.map((n,i)=>`
      <div class="sticky-note" style="--rot: ${(i%2===0?-1:1)*(2+Math.random()*3)}deg;">
        ${EGL.escapeHtml(n.text)}
        <span class="sn-by">${n.by.emoji} ${EGL.escapeHtml(n.by.name)}</span>
      </div>`).join('')}</div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 جدار جديد</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
