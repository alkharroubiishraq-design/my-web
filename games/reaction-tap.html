<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سباق رد الفعل — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .reaction-stage{ text-align:center; padding: 30px 10px; border-radius:18px; transition: background .2s; }
  .reaction-stage.waiting{ background: rgba(255,92,92,.12); }
  .reaction-stage.go{ background: rgba(43,224,138,.25); }
  .reaction-emoji{ font-size:4.5rem; }
  .tap-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:16px; }
  .tap-btn{ font-size:1.1rem; padding:16px 20px; }
  .results-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 10px 0; }
  .result-chip{ background: var(--surface-2); border-radius:10px; padding:8px 12px; font-weight:800; font-size:.82rem; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>⚡ سباق رد الفعل</h1>
    <p>لا يحتاج بنك أسئلة! انتظروا حتى تتحول الشاشة للأخضر، ثم اضغطوا بأسرع ما يمكن — من يضغط قبل الوقت يخسر الجولة!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const ROUNDS = 4;
let players, totals, roundsPlayed, goTime, tapped, waitTimer, round;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">⚡</div><h3>هيّئ اللعبة</h3><p>لا تحتاج بنك أسئلة — مثالية لأي عدد من اللاعبين حول جهاز واحد.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد سباق رد الفعل', allowIndividual:true, allowTeams:false, skipBank:true, minPlayers:2, maxPlayers:8 }, startGame);
}

function startGame(cfg){
  players = cfg.players;
  totals = players.map(()=>({ sum:0, count:0, fouls:0 }));
  round = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="badge" id="round-badge" style="display:block; text-align:center; margin-bottom:8px;"></div><div id="round-area"></div><div class="results-row" id="results-row"></div>`;
  updateResultsRow();
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS){ return showResults(); }
  document.getElementById('round-badge').textContent = `⚡ الجولة ${round} / ${ROUNDS}`;
  startWait();
}

function startWait(){
  clearTimeout(waitTimer);
  tapped = {};
  const area = document.getElementById('round-area');
  area.innerHTML = `
    <div class="reaction-stage waiting" id="stage-box">
      <div class="reaction-emoji">🔴</div>
      <p class="hint">انتظروا... لا تضغطوا الآن!</p>
    </div>
    <div class="tap-row" id="tap-row">${players.map((p,i)=>`<button class="btn btn-outline tap-btn" data-i="${i}">${p.emoji} ${EGL.escapeHtml(p.name)}</button>`).join('')}</div>`;
  document.querySelectorAll('.tap-btn').forEach(btn=>btn.addEventListener('click', ()=>tapEarlyOrGo(parseInt(btn.dataset.i))));
  const delay = 2000 + Math.random()*3500;
  waitTimer = setTimeout(goSignal, delay);
}

function goSignal(){
  goTime = performance.now();
  const box = document.getElementById('stage-box');
  if(box){
    box.classList.remove('waiting'); box.classList.add('go');
    box.querySelector('.reaction-emoji').textContent = '🟢';
    box.querySelector('.hint').textContent = 'الآن! اضغطوا بسرعة!';
  }
  EGL.beep('win');
}

function tapEarlyOrGo(i){
  if(tapped[i] !== undefined) return;
  if(goTime === undefined){
    // tapped too early
    tapped[i] = { foul:true };
    totals[i].fouls++;
    EGL.beep('wrong');
    const btn = document.querySelector(`.tap-btn[data-i="${i}"]`);
    if(btn){ btn.disabled = true; btn.textContent = '❌ مبكر جدًا'; }
  } else {
    const t = performance.now() - goTime;
    tapped[i] = { foul:false, t };
    totals[i].sum += t; totals[i].count++;
    EGL.beep('tick');
    const btn = document.querySelector(`.tap-btn[data-i="${i}"]`);
    if(btn){ btn.disabled = true; btn.textContent = `✅ ${(t/1000).toFixed(2)}ث`; }
  }
  if(Object.keys(tapped).length === players.length){
    setTimeout(()=>{ updateResultsRow(); nextRound(); }, 1400);
  }
}

function updateResultsRow(){
  const row = document.getElementById('results-row');
  if(!row) return;
  row.innerHTML = players.map((p,i)=>{
    const avg = totals[i].count ? (totals[i].sum/totals[i].count/1000).toFixed(2)+'ث' : '—';
    return `<div class="result-chip">${p.emoji} ${EGL.escapeHtml(p.name)}: ${avg} (أخطاء: ${totals[i].fouls})</div>`;
  }).join('');
}

function showResults(){
  EGL.confetti(120); EGL.beep('win');
  const ranked = players.map((p,i)=>({ p, avg: totals[i].count ? totals[i].sum/totals[i].count : Infinity, fouls: totals[i].fouls }))
    .sort((a,b)=> a.avg - b.avg);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهى السباق!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranked.map((r,rk)=>`<div class="player-chip ${rk===0?'active':''}"><div style="font-size:1.4rem;">${rk===0?'🥇':rk===1?'🥈':rk===2?'🥉':r.p.emoji}</div><div class="pname">${EGL.escapeHtml(r.p.name)}</div><div class="pscore">${r.avg===Infinity?'—':(r.avg/1000).toFixed(2)+'ث'}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 سباق جديد</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
