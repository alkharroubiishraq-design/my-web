<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابنِ الإيموجي — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .peek-word{ font-size:2rem; font-weight:900; text-align:center; color: var(--accent-2); margin:14px 0; }
  .emoji-palette{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 14px 0; max-width:520px; margin-inline:auto; }
  .emoji-btn{ font-size:1.7rem; background: var(--surface-2); border-radius:10px; padding:8px 10px; cursor:pointer; border:none; }
  .emoji-btn:disabled{ opacity:.3; cursor:default; }
  .built-combo{ font-size:3rem; text-align:center; min-height:70px; margin: 10px 0; letter-spacing:6px; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🧩 ابنِ الإيموجي</h1>
    <p>يرى اللاعب فقط الكلمة السرية، عليه اختيار حتى ٥ رموز تعبيرية تمثّلها، ثم يخمّن فريقه الكلمة من التركيبة!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const ROUND_TIME = 60;
const PALETTE = ['😀','😂','😍','😱','😴','🤔','😎','🥳','😭','👍','👎','❤️','🔥','⭐','💧','🌞','🌙','⚡','🎉','🎵',
  '🐱','🐶','🦁','🐘','🐍','🐦','🐟','🦋','🌳','🌸','🍎','🍕','⚽','🚗','✈️','🏠','📚','⏰','💰','🔑',
  '👑','🎁','🏆','🎨','🔨','💡','📱','🎈','🌈','☔'];
let sb, players, activeI, pool, poolIdx, secret, chosen, timerInt, timeLeft;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🧩</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة فيه إجابات نصية قصيرة (كلمات يسهل تمثيلها برموز).</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد ابنِ الإيموجي', allowIndividual:true, allowTeams:true, needQuestions:true }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const eligible = bank.questions.filter(q => q.answerText && q.answerText.trim().length >= 2 && q.answerText.trim().length <= 16);
  if(eligible.length < 3){ EGL.toast('تحتاج هذه اللعبة أسئلة ذات إجابات نصية قصيرة (٣ على الأقل)'); return; }
  pool = EGL.shuffle(eligible);
  poolIdx = 0;
  players = cfg.players;
  activeI = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-info"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  startRound();
}

function startRound(){
  clearInterval(timerInt);
  sb.setActive(activeI);
  if(poolIdx >= pool.length){ pool = EGL.shuffle(pool); poolIdx = 0; }
  secret = pool[poolIdx++].answerText.trim();
  chosen = [];
  const area = document.getElementById('round-info');
  area.innerHTML = `
    <div class="qcard">
      <p class="hint">البنّاء: <strong style="color:var(--accent-2)">${players[activeI].emoji} ${EGL.escapeHtml(players[activeI].name)}</strong></p>
      <p>عليه فقط الضغط لرؤية الكلمة، ثم اختيار رموز تمثّلها لفريقه!</p>
      <button class="btn btn-gold" id="btn-peek">👁 اعرض الكلمة لي فقط (٣ ثوانٍ)</button>
    </div>`;
  document.getElementById('btn-peek').addEventListener('click', peekWord);
}

function peekWord(){
  const area = document.getElementById('round-info');
  area.innerHTML = `<div class="qcard"><div class="peek-word">${EGL.escapeHtml(secret)}</div><p class="hint">احفظها... ستبدأ لوحة الرموز تلقائيًا</p></div>`;
  EGL.beep('tick');
  setTimeout(startBuilding, 3000);
}

function startBuilding(){
  timeLeft = ROUND_TIME;
  const area = document.getElementById('round-info');
  area.innerHTML = `
    <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div class="qcard">
      <div class="built-combo" id="built-combo"></div>
      <div class="emoji-palette" id="palette">${PALETTE.map(e=>`<button class="emoji-btn" data-e="${e}">${e}</button>`).join('')}</div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-outline btn-sm" id="btn-clear">🧹 مسح</button>
        <button class="btn btn-gold" id="btn-send">📤 أرسل التركيبة للفريق</button>
      </div>
    </div>`;
  document.querySelectorAll('.emoji-btn').forEach(b=>b.addEventListener('click', ()=>pickEmoji(b.dataset.e)));
  document.getElementById('btn-clear').addEventListener('click', ()=>{ chosen = []; updateCombo(); });
  document.getElementById('btn-send').addEventListener('click', sendCombo);
  timerInt = setInterval(()=>{
    timeLeft--;
    const fill = document.getElementById('timer-fill');
    if(fill) fill.style.width = (timeLeft/ROUND_TIME*100)+'%';
    if(timeLeft<=0) endRound();
  }, 1000);
}

function pickEmoji(e){
  if(chosen.length >= 5) return;
  chosen.push(e);
  updateCombo();
}
function updateCombo(){
  document.getElementById('built-combo').textContent = chosen.join(' ');
}

function sendCombo(){
  if(!chosen.length){ EGL.toast('اختر رمزًا واحدًا على الأقل'); return; }
  const area = document.getElementById('round-info');
  area.innerHTML = `
    <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div class="qcard">
      <p class="hint">خمّنوا الكلمة من هذه التركيبة:</p>
      <div class="built-combo">${chosen.join(' ')}</div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-accent" id="btn-guessed">✅ خمّنوا صح (+15)</button>
        <button class="btn btn-outline" id="btn-give-up">⏭ تخطّي</button>
      </div>
    </div>`;
  document.getElementById('btn-guessed').addEventListener('click', ()=>{ sb.addScore(activeI, 15); EGL.beep('correct'); EGL.confetti(50); endRound(); });
  document.getElementById('btn-give-up').addEventListener('click', endRound);
}

function endRound(){
  clearInterval(timerInt);
  activeI++;
  if(activeI >= players.length){ setTimeout(showResults, 800); return; }
  setTimeout(startRound, 800);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
