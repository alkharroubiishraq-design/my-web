<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكلمة الدخيلة — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .oo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin: 20px 0; }
  .oo-card{ padding:26px 10px; border-radius:16px; background: var(--surface-2); text-align:center; font-weight:800; font-size:1.2rem; cursor:pointer; border:3px solid transparent; }
  .oo-card:hover{ border-color: var(--primary); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🕵️ الكلمة الدخيلة</h1>
    <p>3 كلمات تنتمي لنفس الفئة، وواحدة دخيلة لا تنتمي إليها — اكتشفوها بأسرع وقت!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const ROUNDS = 8, ROUND_TIME = 12;
let sb, players, activeI, byCategory, eligibleCats, round, resolved, roundStart, timerInt, timeLeft;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🕵️</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة فيه فئات متنوعة (٣ فئات على الأقل، وفئة واحدة على الأقل فيها ٣ كلمات).</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد الكلمة الدخيلة', allowIndividual:true, allowTeams:true, needQuestions:true }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  byCategory = {};
  bank.questions.forEach(q=>{
    const a = q.answerText && q.answerText.trim();
    if(!a) return;
    const cat = q.category || 'عام';
    byCategory[cat] = byCategory[cat] || new Set();
    byCategory[cat].add(a);
  });
  Object.keys(byCategory).forEach(k => byCategory[k] = Array.from(byCategory[k]));
  eligibleCats = Object.keys(byCategory).filter(k => byCategory[k].length >= 3);
  if(eligibleCats.length < 1 || Object.keys(byCategory).length < 2){
    EGL.toast('تحتاج فئة واحدة فيها ٣ كلمات على الأقل، وفئة أخرى مختلفة لسحب الكلمة الدخيلة');
    return;
  }
  players = cfg.players;
  activeI = 0;
  round = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS){ showResults(); return; }
  document.getElementById('round-badge').textContent = `🕵️ الجولة ${round} / ${ROUNDS}`;
  renderRound();
}

function renderRound(){
  clearInterval(timerInt);
  resolved = false;
  const targetCat = EGL.pick(eligibleCats);
  const otherCats = Object.keys(byCategory).filter(c => c !== targetCat);
  const oddCat = EGL.pick(otherCats);
  const three = EGL.shuffle(byCategory[targetCat]).slice(0,3);
  const odd = EGL.pick(byCategory[oddCat]);
  const cards = EGL.shuffle([...three.map(w=>({w, odd:false})), {w:odd, odd:true}]);

  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
      <p class="hint" style="text-align:center;">أي كلمة لا تنتمي لنفس فئة البقية؟</p>
      <div class="oo-grid" id="oo-grid"></div>
    </div>`;
  const grid = document.getElementById('oo-grid');
  grid.innerHTML = cards.map(c=>`<div class="oo-card" data-odd="${c.odd?1:0}">${EGL.escapeHtml(c.w)}</div>`).join('');
  grid.querySelectorAll('.oo-card').forEach(el=>el.addEventListener('click', ()=>pick(el)));

  roundStart = performance.now();
  timeLeft = ROUND_TIME;
  timerInt = setInterval(()=>{
    timeLeft--;
    const fill = document.getElementById('timer-fill');
    if(fill) fill.style.width = (timeLeft/ROUND_TIME*100)+'%';
    if(timeLeft<=0) timeUp();
  }, 1000);
}

function pick(el){
  if(resolved) return;
  resolved = true;
  clearInterval(timerInt);
  document.querySelectorAll('.oo-card').forEach(c=>{
    c.style.pointerEvents = 'none';
    if(c.dataset.odd === '1') c.classList.add('correct');
  });
  if(el.dataset.odd === '1'){
    const elapsed = (performance.now()-roundStart)/1000;
    const bonus = Math.max(0, Math.round(ROUND_TIME - elapsed));
    sb.addScore(activeI, 10 + bonus);
    EGL.beep('correct'); EGL.confetti(30);
  } else {
    el.classList.add('wrong');
    EGL.beep('wrong');
  }
  setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 1500);
}

function timeUp(){
  if(resolved) return;
  resolved = true;
  clearInterval(timerInt);
  document.querySelectorAll('.oo-card').forEach(c=>{
    c.style.pointerEvents = 'none';
    if(c.dataset.odd === '1') c.classList.add('correct');
  });
  EGL.beep('wrong');
  EGL.toast('⏱ انتهى الوقت!');
  setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 1400);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
