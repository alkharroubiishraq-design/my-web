<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غزاة الكلمات — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👾</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .invaders-field{ position:relative; width:100%; max-width:820px; height:380px; margin: 14px auto; overflow:hidden;
    background: linear-gradient(180deg, var(--bg-soft), var(--surface)); border-radius: var(--radius); border:1px solid rgba(255,255,255,.08); }
  .falling-word{ position:absolute; top:-50px; padding:10px 18px; border-radius:12px; background: var(--surface-2); font-weight:800;
    cursor:pointer; white-space:nowrap; animation-name: fallDown; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes fallDown{ to{ top: 100%; } }
  .falling-word.frozen{ animation-play-state: paused; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>👾 غزاة الكلمات</h1>
    <p>الكلمات تتساقط من الأعلى — اضغطوا على الإجابة الصحيحة قبل أن تصل للأرض!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, players, activeI, questions, qIdx, roundStart, resolved;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">👾</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة اختيار من متعدد.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد غزاة الكلمات', allowIndividual:true, allowTeams:true, needQuestions:true, qType:['mcq'] }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  questions = EGL.shuffle(bank.questions.filter(q=>q.type==='mcq'));
  if(!questions.length){ EGL.toast('لا توجد أسئلة اختيار من متعدد في هذا البنك'); return; }
  questions = questions.slice(0, 12);
  players = cfg.players;
  activeI = 0; qIdx = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="progress-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  nextQuestion();
}

function nextQuestion(){
  if(qIdx >= questions.length){ showResults(); return; }
  document.getElementById('progress-badge').textContent = `👾 موجة ${qIdx+1} / ${questions.length}`;
  renderWave();
}

function renderWave(){
  resolved = false;
  const q = questions[qIdx];
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard" style="margin-bottom:10px;">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
    </div>
    <div class="invaders-field" id="field"></div>`;
  const field = document.getElementById('field');
  const lanes = EGL.shuffle(q.options.map((o,i)=>i));
  const laneWidth = 100 / q.options.length;
  roundStart = performance.now();
  lanes.forEach((oi, pos) => {
    const el = document.createElement('div');
    el.className = 'falling-word';
    el.textContent = q.options[oi];
    el.dataset.oi = oi;
    el.style.left = (pos * laneWidth + 2) + '%';
    const duration = 4.5 + Math.random()*2.5;
    el.style.animationDuration = duration + 's';
    el.addEventListener('click', () => hitWord(oi, q));
    el.addEventListener('animationend', () => { if(!resolved && parseInt(el.dataset.oi) === q.correctIndex) missWord(q); });
    field.appendChild(el);
  });
}

function freezeField(){
  document.querySelectorAll('.falling-word').forEach(el => el.classList.add('frozen'));
}

function hitWord(oi, q){
  if(resolved) return;
  resolved = true;
  freezeField();
  const el = document.querySelector(`.falling-word[data-oi="${oi}"]`);
  if(oi === q.correctIndex){
    if(el) el.style.background = 'rgba(43,224,138,.4)';
    const elapsed = (performance.now() - roundStart)/1000;
    const bonus = Math.max(0, Math.round(8 - elapsed));
    sb.addScore(activeI, (q.points||10) + bonus);
    EGL.beep('correct'); EGL.confetti(35);
  } else {
    if(el) el.style.background = 'rgba(255,92,92,.4)';
    const correctEl = document.querySelector(`.falling-word[data-oi="${q.correctIndex}"]`);
    if(correctEl) correctEl.style.background = 'rgba(43,224,138,.4)';
    EGL.beep('wrong');
  }
  setTimeout(advance, 1400);
}

function missWord(q){
  if(resolved) return;
  resolved = true;
  freezeField();
  EGL.beep('wrong');
  EGL.toast('⏱ وصلت الكلمة الصحيحة للأرض بدون إجابة!');
  setTimeout(advance, 1200);
}

function advance(){
  activeI = (activeI + 1) % players.length;
  qIdx++;
  nextQuestion();
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الموجات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
