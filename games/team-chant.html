<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بناء هتاف الفريق — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📣</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .chant-line{ font-size:1.6rem; font-weight:900; text-align:center; line-height:2.2; margin: 18px 0; min-height:2.2em; }
  .chant-word{ display:inline-block; margin:0 4px; padding:2px 8px; border-radius:8px; }
  .hype-palette{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin: 14px 0; max-width:640px; margin-inline:auto; }
  .hype-chip{ background: var(--surface-2); border-radius:20px; padding:10px 18px; cursor:pointer; border:none; font-family:inherit; font-weight:800; font-size:.95rem; color:#fff; }
  .hype-chip:hover{ background: var(--primary); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>📣 بناء هتاف الفريق</h1>
    <p>لا يحتاج بنك أسئلة! كل فريق يضيف كلمة حماسية بالتناوب لبناء هتاف جماعي مشترك — واهتفوا به معًا في النهاية!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
const HYPE_WORDS = [
  'معًا!', 'أقوى!', 'إلى الأمام!', 'لن نتوقف!', 'نحن الأفضل!', 'بكل فخر!', 'صف واحد!',
  'قلب واحد!', 'يدًا بيد!', 'إلى القمة!', 'بإصرار!', 'بحماس!', 'كفريق!', 'دائمًا!',
  'ننجح معًا!', 'روح الفريق!', 'هيا بنا!', 'لا نستسلم!', 'نبتسم دومًا!', 'أبطال!',
];
const COLORS = ['#7c5cff','#ff5c9e','#21e6c1','#f0a93f'];
let teams, chant, turnIdx, TARGET;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">📣</div><h3>هيّئ اللعبة</h3><p>لا تحتاج بنك أسئلة — فقط أسماء الفرق المشاركة.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد بناء هتاف الفريق', allowIndividual:false, allowTeams:true, skipBank:true, minPlayers:2, maxPlayers:4 }, startGame);
}

function startGame(cfg){
  teams = cfg.players;
  chant = [];
  turnIdx = 0;
  TARGET = teams.length * 3;
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="badge" id="progress-badge" style="display:block; text-align:center; margin-bottom:6px;"></div>
    <div class="qcard">
      <div class="chant-line" id="chant-line"></div>
    </div>
    <div class="badge" id="turn-badge" style="display:block; text-align:center; margin:10px 0;"></div>
    <div class="hype-palette" id="palette"></div>`;
  renderPalette();
  updateBadges();
}

function renderPalette(){
  document.getElementById('palette').innerHTML = EGL.shuffle(HYPE_WORDS).slice(0,8).map(w=>`<button class="hype-chip" data-w="${EGL.escapeHtml(w)}">${EGL.escapeHtml(w)}</button>`).join('');
  document.querySelectorAll('.hype-chip').forEach(btn=>btn.addEventListener('click', ()=>addWord(btn.dataset.w)));
}

function updateBadges(){
  document.getElementById('progress-badge').textContent = `📣 عدد الكلمات: ${chant.length} / ${TARGET}`;
  const t = teams[turnIdx];
  document.getElementById('turn-badge').innerHTML = `🎯 دور: <span style="color:var(--accent-2)">${t.emoji} ${EGL.escapeHtml(t.name)}</span>`;
}

function addWord(w){
  chant.push({ word:w, teamIdx:turnIdx });
  renderChant();
  EGL.beep('tick');
  turnIdx = (turnIdx+1) % teams.length;
  if(chant.length >= TARGET){ return finishChant(); }
  renderPalette();
  updateBadges();
}

function renderChant(){
  document.getElementById('chant-line').innerHTML = chant.map(c=>`<span class="chant-word" style="background:${COLORS[c.teamIdx%COLORS.length]}33">${EGL.escapeHtml(c.word)}</span>`).join('');
}

function finishChant(){
  EGL.confetti(160); EGL.beep('win');
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">📣</div>
    <h2>هتافكم الجماعي جاهز! اهتفوا به معًا الآن:</h2>
    <div class="chant-line">${chant.map(c=>`<span class="chant-word" style="background:${COLORS[c.teamIdx%COLORS.length]}33">${EGL.escapeHtml(c.word)}</span>`).join('')}</div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 هتاف جديد</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
