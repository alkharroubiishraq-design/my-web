<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة الشخصيات — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .match-cols{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; max-width:820px; margin: 14px auto; }
  .match-col h4{ text-align:center; margin-bottom:8px; color: var(--text-dim); }
  .match-card{ background: var(--surface-2); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; border:3px solid transparent; transition:.15s; font-weight:700; text-align:center; font-size:.9rem; }
  .match-card:hover{ border-color: var(--primary); }
  .match-card.selected{ border-color: var(--accent-2); }
  .match-card.matched{ opacity:.3; pointer-events:none; background: rgba(43,224,138,.2); border-color: var(--success); }
  .match-card.wrong-flash{ background: rgba(255,92,92,.35); border-color: var(--danger); }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🎭 خريطة الشخصيات</h1>
    <p>اقرؤوا القصة، ثم اربطوا كل شخصية بالصفة أو الحدث الصحيح المرتبط بها من النص!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, players, activeI, pairs, matchedCount, selectedName, mistakes, roundStart, round, ROUNDS;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🎭</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة اختيار من متعدد مرتبطة بنص قصصي (اسم الشخصية ← صفتها/فعلها) — بنك تجريبي جاهز للتجربة الفورية.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد خريطة الشخصيات', allowIndividual:true, allowTeams:true, needQuestions:true, qType:['mcq'] }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  const eligible = bank.questions.filter(q=>q.type==='mcq' && q.context);
  const pool = eligible.length >= 4 ? eligible : bank.questions.filter(q=>q.type==='mcq');
  if(pool.length < 4){ EGL.toast('تحتاج هذه اللعبة ٤ أسئلة اختيار من متعدد على الأقل'); return; }
  players = cfg.players;
  activeI = 0;
  round = 0;
  ROUNDS = players.length * 3;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="round-badge" class="badge" style="display:block; text-align:center; margin-bottom:6px;"></div><div id="game-area"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), players);
  window._pool = pool;
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS){ return showResults(); }
  document.getElementById('round-badge').textContent = `🎭 الجولة ${round} / ${ROUNDS}`;
  startRound();
}

function startRound(){
  sb.setActive(activeI);
  const picks = EGL.shuffle(window._pool).slice(0, Math.min(5, window._pool.length));
  pairs = picks.map(q => ({ name: q.text, trait: q.options[q.correctIndex] }));
  matchedCount = 0;
  selectedName = null;
  mistakes = 0;
  roundStart = performance.now();
  const names = EGL.shuffle(pairs.map((p,i)=>({ text:p.name, i })));
  const traits = EGL.shuffle(pairs.map((p,i)=>({ text:p.trait, i })));
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard">
      <div class="qmeta"><span class="badge">دور: ${EGL.escapeHtml(players[activeI].name)}</span></div>
      <p class="hint">اضغطوا شخصية من العمود الأيمن ثم صفتها الصحيحة من العمود الأيسر:</p>
      <div class="match-cols">
        <div class="match-col"><h4>✨ الصفة/الحدث</h4><div id="traits-col"></div></div>
        <div class="match-col"><h4>🎭 الشخصية</h4><div id="names-col"></div></div>
      </div>
    </div>`;
  document.getElementById('names-col').innerHTML = names.map(c=>`<div class="match-card" data-side="name" data-i="${c.i}">${EGL.escapeHtml(c.text)}</div>`).join('');
  document.getElementById('traits-col').innerHTML = traits.map(e=>`<div class="match-card" data-side="trait" data-i="${e.i}">${EGL.escapeHtml(e.text)}</div>`).join('');
  document.querySelectorAll('.match-card').forEach(card=>card.addEventListener('click', ()=>tapCard(card)));
}

function tapCard(card){
  const side = card.dataset.side;
  const i = parseInt(card.dataset.i);
  if(card.classList.contains('matched')) return;
  if(side === 'name'){
    document.querySelectorAll('.match-card[data-side="name"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    selectedName = { i, el: card };
  } else {
    if(!selectedName){ EGL.toast('اضغطوا شخصية أولًا'); return; }
    if(selectedName.i === i){
      card.classList.add('matched');
      selectedName.el.classList.add('matched');
      matchedCount++;
      EGL.beep('correct');
      selectedName = null;
      if(matchedCount === pairs.length) roundComplete();
    } else {
      mistakes++;
      card.classList.add('wrong-flash');
      EGL.beep('wrong');
      setTimeout(()=>card.classList.remove('wrong-flash'), 400);
    }
  }
}

function roundComplete(){
  const elapsed = (performance.now() - roundStart)/1000;
  const speedBonus = Math.max(0, Math.round(15 - elapsed));
  const points = Math.max(10, 25 - mistakes*3) + speedBonus;
  sb.addScore(activeI, points);
  EGL.beep('win'); EGL.confetti(60);
  EGL.toast(`✅ ربطتم كل الشخصيات بصفاتها! +${points} نقطة`);
  setTimeout(()=>{ activeI = (activeI+1) % players.length; nextRound(); }, 2000);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت الجولات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
