<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفقرة المفقودة — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .passage-box{ background: var(--bg-soft); border-radius: var(--radius-sm); padding:16px 20px; margin-bottom:18px; text-align:right; line-height:2; font-size:.98rem; color: var(--text-dim); max-height:240px; overflow-y:auto; border: 1px dashed rgba(255,255,255,.15); }
  .stacked-options{ display:flex; flex-direction:column; gap:12px; }
  .stacked-options .option-btn{ text-align:right; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🧩 الفقرة المفقودة</h1>
    <p>اقرؤوا النص، ثم اختاروا الفقرة أو الجملة الأنسب لسد الفراغ فيه.</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let sb, questions, idx = 0, timerInt, timeLeft, answered;
const TIME_LIMIT = 25;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🧩</div><h3>هيّئ اللعبة</h3><p>أنشئ أسئلة اختيار من متعدد وأرفق لها نصًا مرجعيًا من صفحة بنك الأسئلة — اجعل أحد الخيارات هو الفقرة الصحيحة المكمّلة للنص.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد الفقرة المفقودة', allowIndividual:true, allowTeams:true, needQuestions:true, qType:['mcq'] }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  questions = EGL.shuffle(bank.questions.filter(q=>q.type==='mcq')).slice(0, 12);
  if(!questions.length){ EGL.toast('لا توجد أسئلة اختيار من متعدد في هذا البنك'); return; }
  idx = 0;
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div id="sb-wrap" class="scoreboard"></div><div id="q-wrap"></div>`;
  sb = new EGL.Scoreboard(document.getElementById('sb-wrap'), cfg.players);
  renderQuestion();
}

function renderQuestion(){
  clearInterval(timerInt);
  answered = false;
  timeLeft = TIME_LIMIT;
  const q = questions[idx];
  const activeName = sb.players[sb.activeIndex()].name;
  const wrap = document.getElementById('q-wrap');
  wrap.innerHTML = `
    <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
    <div class="qcard">
      <div class="qmeta">
        <span class="badge">سؤال ${idx+1} / ${questions.length}</span>
        <span class="badge">دور: ${EGL.escapeHtml(activeName)}</span>
      </div>
      ${q.context ? `<div class="passage-box">📖 ${EGL.escapeHtml(q.context)} <strong style="color:var(--accent-2)">[ ... ]</strong></div>` : ''}
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
      <div class="stacked-options" id="opts"></div>
    </div>`;
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = q.options.map((o,i)=>`<button class="option-btn" data-i="${i}">${EGL.escapeHtml(o)}</button>`).join('');
  optsEl.querySelectorAll('.option-btn').forEach(btn=>btn.addEventListener('click', ()=>answer(parseInt(btn.dataset.i))));

  timerInt = setInterval(()=>{
    timeLeft--;
    const fill = document.getElementById('timer-fill');
    if(fill) fill.style.width = (timeLeft/TIME_LIMIT*100)+'%';
    if(timeLeft<=0){ answer(-1); }
  }, 1000);
}

function answer(i){
  if(answered) return;
  answered = true;
  clearInterval(timerInt);
  const q = questions[idx];
  const opts = document.querySelectorAll('.option-btn');
  opts.forEach(b=>b.disabled = true);
  if(i>=0) opts[i].classList.add(i===q.correctIndex?'correct':'wrong');
  opts[q.correctIndex].classList.add('correct');
  const correct = i===q.correctIndex;
  if(correct){
    const bonus = Math.round((timeLeft/TIME_LIMIT) * (q.points*0.5));
    sb.addScore(sb.activeIndex(), q.points + bonus);
    EGL.beep('correct'); EGL.confetti(25);
  } else {
    EGL.beep('wrong');
  }
  setTimeout(()=>{
    sb.nextTurn();
    idx++;
    if(idx < questions.length) renderQuestion();
    else showResults();
  }, 1700);
}

function showResults(){
  EGL.confetti(90);
  EGL.beep('win');
  const ranking = sb.ranking();
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="qcard">
      <div style="font-size:3rem;">🏆</div>
      <h2>انتهت اللعبة!</h2>
      <div class="scoreboard" style="justify-content:center;">
        ${ranking.map((p,r)=>`
          <div class="player-chip ${r===0?'active':''}">
            <div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div>
            <div class="pname">${EGL.escapeHtml(p.name)}</div>
            <div class="pscore">${p.score}</div>
          </div>`).join('')}
      </div>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
        <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
