<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توقّعوا التالي — ساحة الصف</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<link rel="stylesheet" href="../css/style.css">
<style>
  .vote-zones{ display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); width:100%; max-width:800px; margin: 14px auto; }
  .vote-zone{ background: var(--surface-2); border-radius:14px; padding:10px; text-align:center; box-shadow: var(--shadow); }
  .vote-zone .vname{ font-weight:900; margin-bottom:6px; }
  .vote-zone button{ display:block; width:100%; padding:8px 6px; border-radius:8px; border:none; background: var(--surface); color:#fff; font-family:inherit; font-weight:700; font-size:.8rem; cursor:pointer; margin-bottom:6px; }
  .vote-zone button:disabled{ opacity:.4; }
  .vote-zone button.chosen{ border: 2px solid var(--accent-2); }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; max-width:560px; margin-inline:auto; }
  .bar-label{ flex:0 0 140px; font-size:.82rem; font-weight:700; text-align:left; }
  .bar-track{ flex:1; background: var(--surface); border-radius:8px; overflow:hidden; height:22px; }
  .bar-fill{ height:100%; background: var(--primary); transition: width .6s ease; }
  .bar-fill.correct-fill{ background: var(--success); }
  .bar-count{ flex:0 0 26px; font-weight:800; font-size:.8rem; }
</style>
</head>
<body>
<nav class="topnav"><div class="container">
  <a class="brand" href="../index.html"><span class="logo">🎲</span> ساحة الصف</a>
  <div class="navlinks"><a href="../index.html">الرئيسية</a><a href="../index.html#games">الألعاب</a><a href="../questions.html">بنك الأسئلة</a></div>
</div></nav>

<div class="game-shell">
  <div class="game-header container">
    <h1>🔮 توقّعوا التالي</h1>
    <p>توقفنا في منتصف القصة — صوّتوا بفرقكم على ما تتوقعون حدوثه بعد ذلك، ثم قارنوا توقعاتكم بما حدث فعلًا!</p>
  </div>
  <div class="game-stage container" id="stage"></div>
</div>

<script src="../js/common.js"></script>
<script>
let teams, scores, pool, poolIdx, round, ROUNDS, votes, voted;

function init(){
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="empty-state"><div class="emoji">🔮</div><h3>هيّئ اللعبة</h3><p>تحتاج بنك أسئلة اختيار من متعدد مرتبطة بنص قصصي (ماذا سيحدث بعد ذلك؟) — بنك تجريبي جاهز للتجربة الفورية.</p>
    <button class="btn btn-primary" id="btn-setup">ابدأ الإعداد 🎮</button></div>`;
  document.getElementById('btn-setup').addEventListener('click', openSetup);
  openSetup();
}
function openSetup(){
  EGL.openSetupModal({ title:'إعداد توقّعوا التالي', allowIndividual:false, allowTeams:true, needQuestions:true, qType:['mcq'], minPlayers:2, maxPlayers:6 }, startGame);
}

function startGame(cfg){
  const bank = EGL.getBank(cfg.bankId);
  pool = EGL.shuffle(bank.questions.filter(q=>q.type==='mcq'));
  if(!pool.length){ EGL.toast('لا توجد أسئلة اختيار من متعدد في هذا البنك'); return; }
  poolIdx = 0;
  teams = cfg.players;
  scores = teams.map(()=>0);
  round = 0;
  ROUNDS = Math.min(6, pool.length);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="badge" id="round-badge" style="display:block; text-align:center; margin-bottom:8px;"></div><div id="game-area"></div>`;
  nextRound();
}

function nextRound(){
  round++;
  if(round > ROUNDS || poolIdx >= pool.length){ return showResults(); }
  document.getElementById('round-badge').textContent = `🔮 الجولة ${round} / ${ROUNDS}`;
  renderVoting();
}

function renderVoting(){
  const q = pool[poolIdx];
  votes = q.options.map(()=>0);
  voted = teams.map(()=>null);
  const area = document.getElementById('game-area');
  area.innerHTML = `
    <div class="qcard" style="margin-bottom:12px;">
      ${q.context ? `<p class="hint">📖 ${EGL.escapeHtml(q.context)}</p>` : ''}
      <div class="qtext">${EGL.escapeHtml(q.text)}</div>
    </div>
    <div class="vote-zones" id="vote-zones"></div>
    <div style="text-align:center; margin-top:14px;"><button class="btn btn-gold" id="btn-reveal">🔮 اكشف ما حدث فعلًا!</button></div>`;
  const zones = document.getElementById('vote-zones');
  zones.innerHTML = teams.map((t,ti)=>`
    <div class="vote-zone" id="vzone-${ti}">
      <div class="vname">${t.emoji} ${EGL.escapeHtml(t.name)}</div>
      ${q.options.map((o,oi)=>`<button data-ti="${ti}" data-oi="${oi}">${EGL.escapeHtml(o)}</button>`).join('')}
    </div>`).join('');
  zones.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>castVote(parseInt(btn.dataset.ti), parseInt(btn.dataset.oi), q));
  });
}

function castVote(ti, oi, q){
  if(voted[ti] !== null) return;
  voted[ti] = oi;
  votes[oi]++;
  document.querySelectorAll(`#vzone-${ti} button`).forEach(b=>{
    b.disabled = true;
    if(parseInt(b.dataset.oi) === oi) b.classList.add('chosen');
  });
  EGL.beep('tick');
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'btn-reveal') revealOutcome();
});

function revealOutcome(){
  const q = pool[poolIdx];
  document.querySelectorAll('.vote-zone button').forEach(b=>b.disabled=true);
  const btn = document.getElementById('btn-reveal');
  if(btn) btn.disabled = true;
  const area = document.getElementById('game-area');
  const barsHtml = q.options.map((o,oi)=>`
    <div class="bar-row">
      <div class="bar-label">${EGL.escapeHtml(o)}</div>
      <div class="bar-track"><div class="bar-fill ${oi===q.correctIndex?'correct-fill':''}" style="width:${Math.min(100, votes[oi]*100/Math.max(1,teams.length))}%"></div></div>
      <div class="bar-count">${votes[oi]}</div>
    </div>`).join('');
  const banner = document.createElement('div');
  banner.className = 'qcard';
  banner.style.marginTop = '14px';
  banner.innerHTML = `<h3 style="text-align:center;">✅ ما حدث فعلًا: ${EGL.escapeHtml(q.options[q.correctIndex])}</h3>${barsHtml}`;
  area.appendChild(banner);
  teams.forEach((t,ti)=>{
    if(voted[ti] === q.correctIndex){ scores[ti] += 10; EGL.confetti(20); }
  });
  EGL.beep('win');
  setTimeout(()=>{ poolIdx++; nextRound(); }, 3200);
}

function showResults(){
  EGL.confetti(100); EGL.beep('win');
  const ranking = teams.map((t,i)=>({...t, score:scores[i]})).sort((a,b)=>b.score-a.score);
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="qcard">
    <div style="font-size:3rem;">🏆</div><h2>انتهت التوقعات!</h2>
    <div class="scoreboard" style="justify-content:center;">
      ${ranking.map((p,r)=>`<div class="player-chip ${r===0?'active':''}"><div style="font-size:1.4rem;">${r===0?'🥇':r===1?'🥈':r===2?'🥉':p.emoji}</div><div class="pname">${EGL.escapeHtml(p.name)}</div><div class="pscore">${p.score}</div></div>`).join('')}
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
      <button class="btn btn-primary" onclick="location.reload()">🔁 لعب مرة أخرى</button>
      <a class="btn btn-outline" href="../index.html">🏠 الألعاب الأخرى</a>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
